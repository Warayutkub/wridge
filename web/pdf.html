<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF · wridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/ui.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
  .w-head { flex: none; }
  .w-sub { max-width: 640px; }
  .w-actions .btn-primary[disabled] { opacity: .35; }

  .pdf { flex: 1; min-height: 0; display: flex; gap: 20px; padding: 26px 44px 24px; }
  .pdf-side { width: 300px; flex: none; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .pdf-file { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 2px; }
  .pdf-file .w-icon { width: 14px; height: 14px; }
  .pdf-file b { font-size: 14px; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pdf-file .page { font-size: 12px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pdf-file .n { margin-left: auto; flex: none; font: 11px var(--mono); color: var(--text-faint); }
  .icon-btn { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border: 0; border-radius: var(--r-md); background: none; color: var(--text-muted); cursor: pointer; transition: background .15s, color .15s; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn .w-icon { width: 14px; height: 14px; color: inherit; transition: transform .3s var(--ease); }
  .icon-btn:hover .w-icon { transform: rotate(-60deg); }
  .icon-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .pdf-secs { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 2px 2px 8px; margin: 0 -2px; }
  .pdf-sec { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 13px 14px; text-align: left; cursor: pointer; color: var(--text-2);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-lg);
    transition: background .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease), transform .15s var(--ease); }
  .pdf-sec:hover { border-color: var(--border-strong); }
  .pdf-sec:active { transform: scale(.99); }
  .pdf-sec[aria-checked="true"] { background: var(--background); border-color: var(--border-strong); box-shadow: var(--shadow-sm); color: var(--text); }
  .pdf-sec:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .box { flex: none; width: 16px; height: 16px; margin-top: 2px; display: grid; place-items: center; border: 1.5px solid var(--border-strong); border-radius: var(--r-sm);
    background: var(--background); color: var(--on-ink); transition: background .15s var(--ease), border-color .15s var(--ease); }
  .box svg { width: 10px; height: 10px; opacity: 0; transform: scale(.6); transition: opacity .15s var(--ease), transform .15s var(--ease); }
  .pdf-sec[aria-checked="true"] .box { background: var(--ink); border-color: var(--ink); }
  .pdf-sec[aria-checked="true"] .box svg { opacity: 1; transform: none; }
  .pdf-sec .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .pdf-sec b { font-size: 14px; font-weight: 500; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pdf-sec small { font: 11px/1.4 var(--mono); color: var(--text-faint); }
  .pdf-sec small .warn { color: var(--warning-text); }

  .pdf-sum { flex: none; display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; }
  .pdf-sum div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 13px; }
  .pdf-sum dt { color: var(--text-muted); }
  .pdf-sum dd { margin: 0; font: 12.5px var(--mono); color: var(--text); text-align: right; }

  .pdf-main { flex: 1; min-width: 0; overflow-y: auto; padding: 0 4px 24px; }
  .pdf-main-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 28px; margin-bottom: 14px; }
  .pdf-main-head .pills { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .pdf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 18px 12px; align-items: start; }
  .pdf-grid-sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .pdf-grid-sec:first-child { margin-top: 0; }
  .pdf-grid-sec::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
  .pg { margin: 0; display: flex; flex-direction: column; gap: 7px; min-width: 0; animation: w-in .24s var(--ease) backwards; }
  .pg-box { aspect-ratio: 5 / 7; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; background: none; cursor: zoom-in; }
  .pg-box:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: 4px; }
  .pg-sheet { position: relative; overflow: hidden; background: var(--background); border: 1px solid var(--border); border-radius: 3px; display: grid; place-items: center;
    transition: transform .15s var(--ease), box-shadow .15s var(--ease), border-color .15s var(--ease); }
  .pg-box:hover .pg-sheet { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--border-strong); }
  .pg-sheet img { display: block; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .24s var(--ease); }
  .pg-sheet img.on { opacity: 1; }
  .pg-sheet.loading { background: linear-gradient(90deg, var(--surface-1) 0%, var(--background) 50%, var(--surface-1) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
  .pg-sheet .none { font: 10px var(--mono); color: var(--text-faint); }
  .pg.loose .pg-sheet { border-color: var(--warning); box-shadow: 0 0 0 1px var(--warning-line); }
  .pg figcaption { display: flex; gap: 6px; min-width: 0; font-size: 12px; line-height: 1.35; color: var(--text-muted); }
  .pg figcaption b { flex: none; font: 500 11.5px/1.35 var(--mono); color: var(--text); }
  .pg.loose figcaption b { color: var(--warning); }
  .pg figcaption span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pdf-hint { margin: 26px 0 0; font-size: 12px; line-height: 1.6; color: var(--text-faint); max-width: 560px; }
  .pdf-hint code { font: 11.5px var(--mono); color: var(--text-muted); background: var(--surface-2); padding: 1px 5px; border-radius: var(--r-sm); }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* big view of one page */
  .pg-dialog { width: min(880px, calc(100vw - 48px)); }
  .pg-dialog .dialog-body { gap: 12px; padding: 16px; }
  .pg-dialog img { display: block; max-width: 100%; max-height: calc(100vh - 160px); margin: 0 auto; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--background); }
  .pg-dialog .cap { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-muted); }
  .pg-dialog .cap b { font: 500 12px var(--mono); color: var(--text); }
  .pg-dialog .cap .btn { margin-left: auto; }

  /* states */
  .pdf-state { flex: 1; display: grid; place-items: center; padding: 24px 44px 40px; }
  .pdf-state .w-empty { gap: 12px; }
  .pdf-state .w-empty h2 { font-size: 26px; letter-spacing: -.025em; }
  .pdf-state .row { display: flex; gap: 8px; padding-top: 6px; }
  .pdf-state .hint { margin: 2px 0 0; font: 11px var(--mono); color: var(--text-faint); }
  .skel-sec { height: 62px; border-radius: var(--r-lg); }
  .skel-pg { aspect-ratio: 5 / 7; border-radius: 3px; }

  @media (max-width: 860px) {
    body { overflow: auto; height: auto; }
    .w-head { flex-wrap: wrap; padding: 24px 20px 0; }
    .pdf { flex-direction: column; padding: 20px; }
    .pdf-side { width: auto; }
    .pdf-main { overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) { .pg { animation: none; } .pg-sheet.loading { animation: none; } }
</style>
</head>
<body>
<header class="w-head w-fade-in">
  <div class="w-titles">
    <p class="w-label">Design · PDF</p>
    <h1>PDF</h1>
    <p class="w-sub">Join frames into one document, one frame per page. Pages follow the number at the start of each frame name: 1, 2, 10, 100.</p>
  </div>
  <div class="w-actions"><button class="btn btn-primary" id="download" disabled>Download PDF</button></div>
</header>
<main class="pdf w-fade-in" id="view"></main>

<script src="/app-icons.js"></script>
<script src="/ui.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const { esc, toast, setLoading } = window.ui;
  const icon = (n) => window.ui.icon(n);
  const view = $('view');
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* storage blocked */ } } };
  const CHECK = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="m1.8 5.2 2.1 2.1 4.3-4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  let D = null;           // { file, page, sections: [{ id, name, pages: [{ id, name, width, height }], warnings }] }
  let chosen = new Set(); // ids of the checked sections

  // Same rule as the server (pdf.mjs): the number at the very start of the frame name.
  const pageNumber = (name) => { const m = /^\s*(\d+)(?!\d)/.exec(String(name)); return m ? Number(m[1]) : null; };
  const label = (name) => String(name).replace(/^\s*\d+(?!\d)[\s.\-–—:)_]*/, '').trim() || String(name);
  const sizeOf = (bytes) => (bytes >= 1e6 ? `${(bytes / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(bytes / 1e3))} KB`);

  async function fetchJson(url) {
    const res = await fetch(url, { cache: 'no-store' });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(body.error || `HTTP ${res.status}`); e.status = res.status; throw e; }
    return body;
  }

  // ---- states ----
  function state({ mood, title, body, primary, secondary, hint }) {
    $('download').disabled = true;
    view.className = 'pdf-state w-fade-in';
    view.innerHTML = `<div class="w-empty">${window.ui.emptyIcon('inbox', '', mood)}
      <p class="w-label">Design · PDF</p><h2>${esc(title)}</h2><p>${esc(body)}</p>
      <div class="row">${primary ? `<button class="btn btn-primary" id="st-a">${esc(primary[0])}</button>` : ''}${secondary ? `<button class="btn btn-ghost" id="st-b">${esc(secondary[0])}</button>` : ''}</div>
      ${hint ? `<p class="hint">${esc(hint)}</p>` : ''}</div>`;
    if (primary) $('st-a').onclick = primary[1];
    if (secondary) $('st-b').onclick = secondary[1];
  }
  function loadingState() {
    $('download').disabled = true;
    view.className = 'pdf';
    view.innerHTML = `<aside class="pdf-side"><div class="pdf-file"><span class="skel" style="width:120px;height:12px"></span></div>
      <div class="pdf-secs">${'<span class="skel skel-sec"></span>'.repeat(3)}</div></aside>
      <section class="pdf-main"><div class="pdf-main-head"><span class="skel" style="width:120px;height:10px"></span></div>
      <div class="pdf-grid">${'<span class="skel skel-pg"></span>'.repeat(12)}</div></section>`;
  }

  async function load() {
    loadingState();
    try {
      D = await fetchJson('/api/pdf/sections');
    } catch (err) {
      D = null;
      if (err.status === 503) return state({ mood: 'phone', title: 'Figma isn’t connected', body: 'PDF reads the sections on the page that’s open in Figma. Open your design file and run the wridge plugin, then try again.', primary: ['Open Settings', () => window.ui.go('settings')], secondary: ['Try again', load], hint: 'Figma → Plugins → Development → wridge' });
      if (!err.status) return state({ mood: 'stressed', title: 'The server isn’t answering', body: 'Check that the server is running in Overview, then try again.', primary: ['Try again', load], secondary: ['Go to Overview', () => window.ui.go('overview')] });
      return state({ mood: 'dizzy', title: 'Couldn’t read the Figma page', body: err.message, primary: ['Try again', load] });
    }
    if (!D.sections.length) {
      return state({ mood: 'thinking', title: 'No sections with frames yet', body: `On “${D.page ?? 'this page'}” in ${D.file}, put the frames of one document inside a section and start each frame name with its page number, like “1 Cover”, “2 Intro”.`, primary: ['Reload', load], hint: 'Hidden frames are left out' });
    }
    // keep the last choice; an older version stored a single section
    let saved = [];
    try { saved = JSON.parse(store.get('pdf.sections') ?? 'null') ?? [store.get('pdf.section')]; } catch { /* bad value */ }
    chosen = new Set(saved.filter((id) => D.sections.some((s) => s.id === id)));
    if (!chosen.size) chosen.add(D.sections[0].id);
    render();
  }

  // ---- the page order ----
  const picked = () => D.sections.filter((s) => chosen.has(s.id));
  function notes(secs) {
    let last = 0, canvas = 0, hidden = 0;
    const dupes = [];
    for (const s of secs) {
      const nums = s.pages.map((p) => pageNumber(p.name));
      const loose = nums.filter((n) => n === null).length;
      if (loose === nums.length) canvas += loose; else last += loose;
      const seen = new Map();
      for (const n of nums) if (n !== null) seen.set(n, (seen.get(n) ?? 0) + 1);
      for (const [n, c] of seen) if (c > 1) dupes.push(n);
      // hidden frames the server left out
      hidden += s.issues?.hidden?.length ?? 0;
    }
    const out = [];
    if (last) out.push(['warn', `${plural(last, 'frame')} without a number go last`]);
    if (canvas) out.push(['warn', `${plural(canvas, 'frame')} without a number · canvas order`]);
    if (dupes.length) out.push(['warn', `${dupes.length === 1 ? `Number ${dupes[0]} is used twice` : `Numbers ${dupes.join(', ')} are used twice`} · canvas position decides`]);
    if (hidden) out.push(['', `${plural(hidden, 'hidden frame')} left out`]);
    return out;
  }
  const secNote = (s) => {
    const nums = s.pages.map((p) => pageNumber(p.name));
    const loose = nums.filter((n) => n === null).length;
    return loose && loose < nums.length ? ` · <span class="warn">${loose} without a number</span>` : '';
  };

  function render() {
    const secs = picked();
    const pages = secs.flatMap((s) => s.pages.map((p) => ({ ...p, section: s })));
    // a rough guide: Figma's vector PDFs come to about 0.15 byte per pixel of frame
    const est = pages.reduce((n, p) => n + (p.width * p.height * 0.15), 0);
    $('download').disabled = !pages.length;
    view.className = 'pdf';
    view.innerHTML = `
      <aside class="pdf-side" aria-label="Sections on the open Figma page">
        <div class="pdf-file" title="${esc(D.file)} › ${esc(D.page ?? '')}"><span class="w-icon">${icon('logo-figma')}</span><b>${esc(D.file)}</b><span class="page">${esc(D.page ?? '')}</span>
          <span class="n">${plural(D.sections.length, 'section')}</span><button class="icon-btn" id="reload" aria-label="Read Figma again" title="Read Figma again"><span class="w-icon">${icon('restart')}</span></button></div>
        <div class="pdf-secs" role="group" aria-label="Sections">
          ${D.sections.map((s) => `<button class="pdf-sec" role="checkbox" data-id="${esc(s.id)}" aria-checked="${chosen.has(s.id)}">
            <span class="box">${CHECK}</span><span class="txt"><b title="${esc(s.name)}">${esc(s.name)}</b><small>${plural(s.pages.length, 'frame')}${secNote(s)}</small></span></button>`).join('')}
        </div>
        <dl class="pdf-sum w-card" style="margin:0">
          <div><dt>Pages</dt><dd>${pages.length}</dd></div>
          <div><dt>Page size</dt><dd>from each frame</dd></div>
          <div><dt>Estimated size</dt><dd>${pages.length ? `≈ ${sizeOf(est)}` : '–'}</dd></div>
        </dl>
      </aside>
      <section class="pdf-main" aria-label="Page order">
        <div class="pdf-main-head"><span class="w-label">Page order · ${pages.length}</span>
          <span class="pills">${notes(secs).map(([k, t]) => `<span class="w-pill sans dot ${k}">${esc(t)}</span>`).join('')}</span></div>
        ${pages.length ? `<div class="pdf-grid" id="grid">${secs.map((s) => `${secs.length > 1 ? `<div class="pdf-grid-sec"><span class="w-label">${esc(s.name)} · ${s.pages.length}</span></div>` : ''}${s.pages.map((p, i) => {
          const n = pageNumber(p.name);
          // fit the frame's own shape inside the 5:7 tile (a width in % always resolves; the ratio gives the height)
          const fit = Math.min(100, ((p.width / p.height) / (5 / 7)) * 100);
          return `<figure class="pg${n === null ? ' loose' : ''}" style="animation-delay:${Math.min(i, 16) * 18}ms">
            <button class="pg-box" data-pg="${esc(p.id)}" aria-label="Page ${n ?? 'without a number'}: ${esc(p.name)} — view larger"><span class="pg-sheet loading" style="width:${fit.toFixed(2)}%;aspect-ratio:${p.width} / ${p.height}"><img alt="" data-id="${esc(p.id)}"></span></button>
            <figcaption title="${esc(p.name)} · ${Math.round(p.width)} × ${Math.round(p.height)}"><b>${n ?? '–'}</b><span>${esc(label(p.name))}</span></figcaption></figure>`;
        }).join('')}`).join('')}</div>` : `<div class="w-empty" style="padding:56px 24px"><h2>No section chosen</h2><p>Tick one or more sections on the left. Their frames become the pages, in the order shown here.</p></div>`}
        <p class="pdf-hint">Add a page by starting a frame name with a number, like <code>3 Chapter 1</code>. Numbers sort as numbers (1, 2, 10, 100) so no leading zeros are needed. Hidden frames are left out.</p>
      </section>`;
    view.querySelectorAll('.pdf-sec').forEach((b) => (b.onclick = () => {
      const id = b.dataset.id;
      if (chosen.has(id)) chosen.delete(id); else chosen.add(id);
      store.set('pdf.sections', JSON.stringify([...chosen]));
      const top = view.querySelector('.pdf-secs').scrollTop;
      render();
      view.querySelector('.pdf-secs').scrollTop = top;
      view.querySelector(`.pdf-sec[data-id="${CSS.escape(id)}"]`)?.focus();
    }));
    view.querySelectorAll('[data-pg]').forEach((b) => (b.onclick = () => openPage(pages.find((p) => p.id === b.dataset.pg))));
    $('reload').onclick = load;
    loadThumbs();
  }

  // ---- previews: one at a time (each is a round trip through the Figma plugin), kept while the page is open ----
  const thumbs = new Map(); // frame id → object URL | null (failed)
  let queue = [], running = false;
  function loadThumbs() {
    const imgs = [...view.querySelectorAll('img[data-id]')];
    queue = [];
    for (const img of imgs) {
      const id = img.dataset.id;
      if (thumbs.has(id)) show(img, thumbs.get(id)); else queue.push(id);
    }
    if (!running) pump();
  }
  function show(img, url) {
    const sheet = img.parentElement;
    sheet.classList.remove('loading');
    if (!url) { img.remove(); sheet.innerHTML = '<span class="none">no preview</span>'; return; }
    img.onload = () => img.classList.add('on');
    img.src = url;
  }
  async function pump() {
    running = true;
    while (queue.length) {
      const id = queue.shift();
      if (thumbs.has(id)) continue;
      try {
        const res = await fetch(`/api/thumb?id=${encodeURIComponent(id)}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        thumbs.set(id, URL.createObjectURL(await res.blob()));
      } catch { thumbs.set(id, null); }
      view.querySelectorAll(`img[data-id="${CSS.escape(id)}"]`).forEach((img) => show(img, thumbs.get(id)));
    }
    running = false;
  }

  function openPage(p) {
    if (!p) return;
    const url = thumbs.get(p.id);
    const n = pageNumber(p.name);
    const d = document.createElement('dialog');
    d.className = 'dialog pg-dialog';
    d.innerHTML = `<div class="dialog-body">${url ? `<img src="${url}" alt="${esc(p.name)}">` : `<div class="w-empty"><p>${thumbs.has(p.id) ? 'No preview for this frame.' : 'The preview is still loading…'}</p></div>`}
      <div class="cap"><b>${n ?? '–'}</b><span>${esc(p.name)} · ${Math.round(p.width)} × ${Math.round(p.height)} · ${esc(p.section.name)}</span><button class="btn btn-secondary" value="close">Close</button></div></div>`;
    const close = () => d.remove();
    d.querySelector('[value="close"]').onclick = close;
    d.addEventListener('click', (e) => { if (e.target === d) close(); });
    d.addEventListener('cancel', (e) => { e.preventDefault(); close(); });
    document.body.append(d);
    d.showModal();
  }

  // ---- download: the server builds the PDF in memory; in the wridge window a Save dialog asks where it goes ----
  // → { name, path? }, or null when the Save dialog was cancelled
  async function save(url, btn) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) { const body = await res.json().catch(() => ({})); throw Object.assign(new Error(body.error || `HTTP ${res.status}`), { status: res.status }); }
    const blob = await res.blob();
    const name = decodeURIComponent((res.headers.get('Content-Disposition') ?? '').match(/filename\*=UTF-8''([^;]+)/)?.[1] ?? 'design.pdf');
    setLoading(btn, true, 'Choose where to save…');
    return ui.saveFile(blob, name);
  }
  const saved = (r, what) => toast(`${r.path ? 'Saved' : 'Downloaded'} ${r.name} · ${what}`, r.path ? { action: 'Show in folder', onAction: () => ui.reveal(r.path), duration: 6000 } : {});
  async function download() {
    const secs = picked();
    const total = secs.reduce((n, s) => n + s.pages.length, 0);
    if (!total) return;
    const btn = $('download');
    setLoading(btn, true, `Joining ${plural(total, 'page')}…`);
    try {
      if (secs.length === 1) {
        const r = await save(`/api/pdf/download?id=${encodeURIComponent(secs[0].id)}`, btn);
        if (!r) return; // Save dialog cancelled
        saved(r, plural(total, 'page'));
      } else {
        // One document from several sections (ids=a,b); a server without that sends each section as its own file.
        let r, many = false;
        try { r = await save(`/api/pdf/download?ids=${secs.map((s) => encodeURIComponent(s.id)).join(',')}`, btn); } catch (err) { if (err.status !== 400) throw err; many = true; }
        if (many) {
          for (const s of secs) {
            setLoading(btn, true, `Joining ${plural(s.pages.length, 'page')}…`);
            r = await save(`/api/pdf/download?id=${encodeURIComponent(s.id)}`, btn);
            if (!r) return;
          }
          return saved({ ...r, name: plural(secs.length, 'PDF') }, `one per section · ${plural(total, 'page')}`);
        }
        if (!r) return;
        saved(r, plural(total, 'page'));
      }
      window.ui.celebrate();
    } catch (err) {
      toast(`Couldn’t make the PDF — ${err.status === 503 ? 'the Figma plugin isn’t connected' : err.message}`, { kind: 'error' });
    } finally {
      setLoading(btn, false);
    }
  }

  $('download').onclick = download;
  load();
})();
</script>
</body>
</html>
