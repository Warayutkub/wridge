<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills · wridge</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="/ui.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
  .shell-main > .w-head, body > .w-head { flex: none; }
  .w-head { align-items: flex-end; }
  .w-search { width: 240px; transition: border-color .15s, width .2s var(--ease); }
  .w-search:focus-within { width: 280px; }

  /* list on the left, the reader on the right; both scroll on their own */
  .sk { flex: 1; min-height: 0; display: flex; gap: 16px; padding: 24px 44px 24px; }
  .sk-list { width: 300px; flex: none; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 0 2px 8px; margin: 0 -2px; }
  .sk-group { display: flex; flex-direction: column; gap: 1px; }
  .sk-group-head { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 6px; }
  .sk-group-head .n { font: 11px var(--mono); color: var(--text-faint); }
  .sk-row { width: 100%; border: 1px solid transparent; background: none; text-align: left; font: 13px/1.4 var(--mono); color: var(--text-2);
    transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease); }
  .sk-row .w-icon { width: 14px; height: 14px; color: var(--text-muted); transition: color .15s var(--ease), transform .15s var(--ease); }
  .sk-row span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sk-row:hover { color: var(--text); }
  .sk-row:hover .w-icon { color: var(--text-2); transform: rotate(-8deg); }
  .sk-row.on { box-shadow: var(--shadow-sm); font-weight: 500; }
  .sk-row.on .w-icon { color: var(--text); }
  .sk-row mark { background: var(--primary-soft); color: var(--primary); border-radius: 2px; }
  .sk-row:focus-visible, .sk-reader:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .sk-none { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 8px 10px; font-size: 13px; color: var(--text-muted); }

  .sk-reader { flex: 1; min-width: 0; overflow-y: auto; padding: 26px 30px 36px; }
  .sk-meta { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .sk-meta .sk-open { margin-left: auto; flex: none; padding: 5px 12px; font-size: 12px; }
  .sk-meta .path { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11.5px var(--mono); color: var(--text-faint); }
  .sk-reader h1 { margin: 26px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -.025em; line-height: 1.2; }
  .sk-desc code { font: 13px var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: var(--r-sm); color: var(--text-2); }
  .sk-desc { margin: 14px 0 0; font-size: 15px; line-height: 1.6; color: var(--text-muted); max-width: 720px; }
  .sk-rule { margin: 18px 0 22px; border: 0; border-top: 1px solid var(--border); }
  .sk-in { animation: w-in .24s var(--ease); }

  /* the skill's markdown */
  .md { font-size: 14px; line-height: 1.65; color: var(--text-2); overflow-wrap: anywhere; max-width: 820px; }
  .md > :first-child { margin-top: 0; }
  .md h1, .md h2 { font-size: 17px; line-height: 1.4; font-weight: 600; letter-spacing: -.01em; color: var(--text); margin: 26px 0 10px; }
  .md h3, .md h4 { font-size: 15px; line-height: 1.45; font-weight: 600; color: var(--text); margin: 20px 0 8px; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md .w-tbl { margin: 0 0 12px; }
  .md ul, .md ol { padding-left: 20px; }
  .md li { margin: 3px 0; }
  .md li::marker { color: var(--text-faint); }
  .md b { color: var(--text); font-weight: 600; }
  .md code { font: 12.5px var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: var(--r-sm); color: var(--text); }
  .md pre { padding: 12px 14px; background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-lg); overflow-x: auto; }
  .md pre code { background: none; padding: 0; white-space: pre; font-size: 12px; line-height: 1.6; color: var(--text-2); }
  .md blockquote { padding: 2px 0 2px 14px; border-left: 2px solid var(--border-strong); color: var(--text-muted); }
  .md hr { margin: 20px 0; border: 0; border-top: 1px solid var(--border); }
  .md .w-tbl table { font-size: 13px; }
  .md .w-tbl th { font: 500 10.5px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
  .md .w-tbl td:first-child { white-space: normal; min-width: 140px; }
  .md .w-tbl code { font-size: 12px; }

  /* states */
  .sk-state { flex: 1; display: grid; place-items: center; }
  .sk-state .w-label { margin-top: -4px; }
  .sk-skel { display: flex; flex-direction: column; gap: 8px; }
  .sk-skel .skel { height: 14px; }

  @media (max-width: 860px) {
    body { overflow: auto; height: auto; }
    .w-head { flex-wrap: wrap; padding: 24px 20px 0; }
    .sk { flex-direction: column; padding: 20px; }
    .sk-list { width: auto; max-height: 280px; }
    .sk-reader { overflow: visible; padding: 22px 20px 28px; }
  }
  @media (prefers-reduced-motion: reduce) { .sk-in { animation: none; } .w-search { transition: none; } }
</style>
</head>
<body>
<header class="w-head w-fade-in">
  <div class="w-titles">
    <p class="w-label" id="count">Skills</p>
    <h1>Skills</h1>
    <p class="w-sub">How-to guides the AI loads before a kind of work. They ship with wridge and work in every project.</p>
  </div>
  <div class="w-actions">
    <label class="w-search"><span class="w-icon" data-ic="search"></span><input id="search" type="search" placeholder="Find a skill…" aria-label="Find a skill" autocomplete="off" spellcheck="false"><span class="w-kbd">Ctrl K</span></label>
  </div>
</header>
<main class="sk w-fade-in" id="main">
  <nav class="sk-list" id="list" aria-label="Skills"></nav>
  <article class="sk-reader w-card" id="detail" aria-live="polite" tabindex="-1"></article>
</main>

<script src="/app-icons.js"></script>
<script src="/ui.js"></script>
<script>
(() => {
  const { esc } = window.ui;
  const $ = (id) => document.getElementById(id);
  // The server gives each skill an area: design, code, or both (no area = listed in every session).
  const AREAS = [['design', 'Design', 'accent'], ['code', 'Code', ''], ['both', 'Every session', 'ok']];
  const AREA = Object.fromEntries(AREAS.map(([k, label, tone]) => [k, { label, tone }]));
  const icon = (name) => window.ui.icon(name);
  let skills = [];
  let failed = false;

  const selected = () => decodeURIComponent(location.hash.slice(1));
  const query = () => $('search').value.trim().toLowerCase();
  const tokens = (n) => `~${Number(n || 0).toLocaleString('en-US')} tokens`;
  // the guide's own title is its first "# " heading
  const titleOf = (s) => /^#\s+(.+)$/m.exec(s.body ?? '')?.[1]?.trim() ?? s.name;
  const mark = (text, q) => {
    const t = esc(text);
    if (!q) return t;
    const i = text.toLowerCase().indexOf(q);
    return i < 0 ? t : `${esc(text.slice(0, i))}<mark>${esc(text.slice(i, i + q.length))}</mark>${esc(text.slice(i + q.length))}`;
  };

  function visible() {
    const q = query();
    return skills.filter((s) => !q || `${s.name} ${s.description}`.toLowerCase().includes(q));
  }

  function renderList() {
    const list = $('list');
    const items = visible();
    const q = query();
    if (!items.length) {
      list.innerHTML = `<div class="sk-none"><span>No skill matches “${esc($('search').value.trim())}”.</span><button class="btn btn-secondary" id="clear">Clear search</button></div>`;
      $('clear').onclick = () => { $('search').value = ''; renderList(); $('search').focus(); };
      return;
    }
    const sel = selected();
    list.innerHTML = AREAS.map(([key]) => {
      const rows = items.filter((s) => s.area === key);
      if (!rows.length) return '';
      return `<section class="sk-group"><div class="sk-group-head"><span class="w-label">${esc(AREA[key].label)}</span><span class="n">${rows.length}</span></div>
        ${rows.map((s) => `<button class="w-row sk-row${s.name === sel ? ' on' : ''}" data-name="${esc(s.name)}" aria-current="${s.name === sel}" title="${esc(s.description)}">
          <span class="w-icon">${icon('skills')}</span><span>${mark(s.name, q)}</span></button>`).join('')}</section>`;
    }).join('');
  }

  function renderDetail() {
    const box = $('detail');
    const s = skills.find((x) => x.name === selected());
    if (!s) { box.innerHTML = ''; return; }
    const a = AREA[s.area] ?? AREA.both;
    const title = titleOf(s);
    // the title is drawn above: drop the guide's own first heading from the body
    const body = (s.body ?? '').replace(/^\s*#\s+.+\n?/, '');
    box.innerHTML = `<div class="sk-in">
      <div class="sk-meta"><span class="w-pill sans dot ${a.tone}">${esc(a.label.toLowerCase())}</span><span class="path" title="${esc(s.file)}">${esc(s.file)} · ${tokens(s.tokens)}</span><button class="btn btn-secondary sk-open" type="button"><span class="w-icon">${window.ui.icon('folder')}</span>Open file</button></div>
      <h1>${esc(title)}</h1>
      <p class="sk-desc">${inline(s.description)}</p>
      <hr class="sk-rule">
      <div class="md">${markdown(body)}</div></div>`;
    box.scrollTop = 0;
    // opens the guide in VS Code (server: POST /api/skills/open, only names from the skills list)
    const open = box.querySelector('.sk-open');
    open.onclick = async () => {
      window.ui.setLoading(open, true, 'Opening…');
      try {
        const res = await fetch('/api/skills/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file: s.file }) });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(out.error ?? `HTTP ${res.status}`);
        window.ui.toast('Opened in VS Code');
      } catch (err) { window.ui.toast(`Couldn’t open it — ${err.message}`, { kind: 'error' }); }
      finally { window.ui.setLoading(open, false); }
    };
  }

  function renderLoading() {
    $('count').textContent = 'Skills';
    $('list').innerHTML = [8, 6, 5].map((n) => `<div class="sk-group"><div class="sk-group-head"><span class="skel" style="width:72px;height:10px"></span></div>
      <div class="sk-skel" style="padding:6px 10px">${'<span class="skel"></span>'.repeat(n)}</div></div>`).join('');
    $('detail').innerHTML = `<div class="sk-skel"><span class="skel" style="width:160px;height:20px"></span><span class="skel" style="width:280px;height:28px;margin-top:18px"></span>
      <span class="skel" style="margin-top:12px"></span><span class="skel" style="width:70%"></span><span class="skel" style="margin-top:24px"></span><span class="skel"></span><span class="skel" style="width:60%"></span></div>`;
  }

  function renderFailed() {
    $('count').textContent = 'Skills';
    $('main').innerHTML = `<div class="sk-state"><div class="w-empty w-fade-in">${window.ui.emptyIcon('alert')}
      <p class="w-label">Skills</p><h2>Couldn't load the skills</h2>
      <p>wridge reads its skills/ folder on every visit and that didn't work. Check that the server is running, then try again.</p>
      <div class="actions"><button class="btn btn-primary" id="retry">Try again</button><button class="btn btn-ghost" id="to-settings">Open Settings</button></div></div></div>`;
    $('retry').onclick = () => location.reload();
    $('to-settings').onclick = () => window.ui.go('settings');
  }

  async function load() {
    failed = false;
    renderLoading();
    try {
      const res = await fetch('/api/skills', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.statusText);
      skills = await res.json();
    } catch {
      failed = true;
      skills = [];
      return renderFailed();
    }
    // grouped order: design, code, every session — each A→Z
    const rank = Object.fromEntries(AREAS.map(([k], i) => [k, i]));
    skills.sort((a, b) => (rank[a.area] ?? 9) - (rank[b.area] ?? 9) || a.name.localeCompare(b.name));
    $('count').textContent = `Skills · ${skills.length}`;
    if (skills.length && !skills.some((s) => s.name === selected())) history.replaceState(null, '', `#${encodeURIComponent(skills[0].name)}`);
    if (!skills.length) {
      $('list').innerHTML = '<div class="sk-none">No skills in the skills/ folder yet.</div>';
      $('detail').innerHTML = '';
      return;
    }
    renderList();
    renderDetail();
    $('list').querySelector('.on')?.scrollIntoView({ block: 'nearest' }); // a link to a skill further down
  }

  // ---- minimal markdown (skills are wridge's own files; everything is escaped first) ----
  function inline(text) {
    return esc(text)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
  }
  function markdown(src) {
    const lines = src.replace(/\r/g, '').split('\n');
    const out = [];
    let para = [];
    let list = null; // { tag, items }
    const flush = () => {
      if (para.length) out.push(`<p>${inline(para.join(' '))}</p>`);
      para = [];
      if (list) out.push(`<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join('')}</${list.tag}>`);
      list = null;
    };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      let m;
      if (/^\s*```/.test(line)) {
        flush();
        const code = [];
        while (++i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i]);
        out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
      } else if ((m = /^(#{1,4})\s+(.*)$/.exec(line))) {
        flush();
        out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);
      } else if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) {
        flush();
        out.push('<hr>');
      } else if (/^\s*\|/.test(line)) {
        flush();
        const rows = [];
        for (; i < lines.length && /^\s*\|/.test(lines[i]); i++) {
          if (/^\s*\|[\s:|-]+\|\s*$/.test(lines[i])) continue; // header separator
          rows.push(lines[i].trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim()));
        }
        i--;
        const [head, ...body] = rows;
        out.push(`<div class="w-tbl"><table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      } else if ((m = /^\s*([-*]|\d+\.)\s+(.*)$/.exec(line))) {
        const t = /\d/.test(m[1]) ? 'ol' : 'ul';
        if (para.length || (list && list.tag !== t)) flush();
        list ??= { tag: t, items: [] };
        list.items.push(m[2]);
      } else if (list && /^\s{2,}\S/.test(line)) {
        list.items[list.items.length - 1] += ` ${line.trim()}`; // wrapped list item
      } else if ((m = /^>\s?(.*)$/.exec(line))) {
        flush();
        out.push(`<blockquote>${inline(m[1])}</blockquote>`);
      } else if (!line.trim()) {
        flush();
      } else {
        if (list) flush();
        para.push(line.trim());
      }
    }
    flush();
    return out.join('');
  }

  // ---- events ----
  document.querySelectorAll('[data-ic]').forEach((el) => { el.innerHTML = icon(el.dataset.ic); });
  $('search').addEventListener('input', () => { if (!failed) renderList(); });
  $('search').addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('search').value) { e.stopPropagation(); $('search').value = ''; renderList(); }
    if (e.key === 'Enter') { const first = visible()[0]; if (first) { history.replaceState(null, '', `#${encodeURIComponent(first.name)}`); renderList(); renderDetail(); } }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('search').focus(); $('search').select(); }
  });
  $('main').addEventListener('click', (e) => {
    const b = e.target.closest('.sk-row');
    if (!b) return;
    history.replaceState(null, '', `#${encodeURIComponent(b.dataset.name)}`);
    renderList();
    renderDetail();
  });
  window.addEventListener('hashchange', () => { if (!failed) { renderList(); renderDetail(); $('list').querySelector('.on')?.scrollIntoView({ block: 'nearest' }); } });

  load();
})();
</script>
</body>
</html>
