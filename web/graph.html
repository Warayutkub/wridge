  // ‹ › / ↑ ↓ / Enter: bring one hit into view (the panel stays on the list).
  function focusHit(h) {
    if (is3D) { if (h.node) graph3d.focus(h.node); else graph3d.fitIds(new Set(h.members)); return; }
    mindmap.centerPath(h.path);
  }
  // A click on a result opens its details (the search stays lit; "← Results" goes back to the list).
  function openHit(i) {
    gs.go(i);
    const h = search?.hits[i];
    if (h?.node) select(h.node);
  }
  const gs = GraphSearch.attach({
    input: $('search'), bar: $('search-bar'), kinds: SEARCH_KINDS,
    find: (needle) => (raw ? findHits(needle) : []),
    apply: applySearch,
    focus: (h) => focusHit(h),
    empty: (q) => {
      document.body.classList.add('searching');
      $('canvas-state').innerHTML = `<div class="center"><div class="result-card empty">${ui.emptyIcon('search', '', 'thinking')}
        <h3>No match for “${esc(q)}”</h3><p>Try a frame or component name, like ${esc(raw?.nodes.slice(0, 2).map((n) => n.name).join(', ') ?? '')}</p>
        <button class="btn btn-primary" id="clear-search">Clear search</button></div></div>`;
      $('clear-search').onclick = () => { gs.clear(); clearCanvasState(); $('search').focus(); };
    },
  });
  // search.js still writes its results bar in Thai; this page shows it in English until the shared file is translated.
  const EN = [
    [/^พบ ([\d,]+) รายการ — .*$/, '$1 matches — too broad to highlight. Type a little more.'],
    [/^ไม่พบ “(.*)”$/, 'No match for “$1”'],
    [/^พบ (\d+)$/, '$1 found'],
    [/^… อีก (\d+)$/, '… $1 more'],
  ];
  function english(rootEl) {
    const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT);
    for (let t = walker.nextNode(); t; t = walker.nextNode()) {
      for (const [re, to] of EN) if (re.test(t.nodeValue)) { t.nodeValue = t.nodeValue.replace(re, to); break; }
    }
    rootEl.querySelectorAll('[aria-label="ก่อนหน้า"]').forEach((b) => b.setAttribute('aria-label', 'Previous'));
    rootEl.querySelectorAll('[aria-label="ถัดไป"]').forEach((b) => b.setAttribute('aria-label', 'Next'));
  }
  for (const target of [$('search-bar'), panel]) new MutationObserver(() => english(target)).observe(target, { childList: true, subtree: true });

  // ======================= canvas chrome =======================
  function clearCanvasState() { $('canvas-state').innerHTML = ''; document.body.classList.remove('searching'); }

  function render() {
    select(null);
    renderLegend();
    if (!raw.nodes.length) {
      mindmap.hide(); graph3d.hide();
      $('canvas-state').innerHTML = `<div class="center"><div class="result-card empty">${ui.emptyIcon('inbox', '', 'thinking')}<h3>No prototype screens</h3>
        <p>The map shows frames in Prototype sections and frames placed on the page. Add some in Figma, then rescan.</p></div></div>`;
      return;
    }
    clearCanvasState();
    if (is3D) { mindmap.hide(); graph3d.show(); } else { graph3d.hide(); mindmap.show(); if (search) showSearchInTree(true); }
  }

  function renderLegend() {
    if (!raw) return;
    const p = pal();
    const screens = raw.nodes.filter((n) => n.type === 'screen');
    const comps = raw.nodes.filter((n) => n.type === 'component');
    const bad = raw.nodes.filter((n) => n.issue && n.issue !== 'unused').length;
    const unused = comps.filter((n) => n.issue === 'unused').length;
    const sw = (c, ring) => `<i class="sw" style="${ring ? `border:1.5px solid ${c}` : `background:${c}`}"></i>`;
    $('legend').innerHTML = is3D
      ? `<span>${sw(p.screen)}Screen <b>${screens.length}</b></span><span>${sw(p.start)}Flow start <b>${screens.filter((n) => n.flowStart).length}</b></span>
         <span>${sw(p.comp)}Component <b>${comps.length - unused}</b></span><span>${sw(p.issue)}Issue <b>${bad}</b></span><span>${sw(p.unused)}Unused <b>${unused}</b></span>`
      : `<span>${sw('var(--ink)')}File</span><span>${sw('var(--primary)')}Page / group</span><span>${sw('var(--border-strong)', true)}Screen</span><span>${sw('var(--danger)')}Issue <b>${bad}</b></span>`;
  }

  // ======================= view mode & states =======================
  function setMode(m) {
    if (m === mode && !stateKind && raw) return;
    mode = m;
    try { localStorage.setItem('wridge-design-map-view', m); } catch { /* not kept */ }
    applyMode();
  }
  function applyMode() {
    is3D = mode === '3d';
    const onCanvas = mode !== 'list';
    $('mode').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    document.body.classList.toggle('canvas-mode', onCanvas && !stateKind);
    document.body.classList.toggle('mode-3d', is3D);
    if (stateKind || !raw) {
      $('list-view').hidden = true; $('canvas-view').hidden = true; $('state-view').hidden = false;
      if (stateKind === 'loading') showState('loading');
      return;
    }
    $('state-view').hidden = true;
    $('list-view').hidden = onCanvas;
    $('canvas-view').hidden = !onCanvas;
    if (onCanvas) render();
    else { graph3d.hide(); mindmap.hide(); renderList(); }
  }

  let waitTimer = null;
  function stopWaiting() { clearInterval(waitTimer); waitTimer = null; }
  // Not connected: check every few seconds and load by itself once the plugin joins.
  function waitForPlugin() {
    stopWaiting();
    waitTimer = setInterval(async () => {
      try {
        const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
        if (s.pluginConnected && stateKind === 'unplugged') { stopWaiting(); load(); }
      } catch { /* server away: keep waiting */ }
    }, 5000);
  }

  function showState(kind, detail = '') {
    stateKind = kind;
    document.body.classList.remove('canvas-mode');
    $('list-view').hidden = true; $('canvas-view').hidden = true;
    const v = $('state-view');
    v.hidden = false;
    const sk = (w, h, r = 6) => `<span class="skel" style="width:${w};height:${h}px;border-radius:${r}px;flex:none"></span>`;
    if (kind === 'loading') {
      v.innerHTML = mode === 'list'
        ? `<div class="dm-list sk-wrap" aria-busy="true">
            <div class="w-card strip">${sk('40px', 40, 10)}<div class="strip-text">${sk('150px', 15)}<span class="strip-meta"><span class="spinner"></span>Reading the Figma file…</span></div>
              <div class="stats">${[0, 1, 2, 3].map(() => `<div class="stat-n">${sk('28px', 20)}${sk('56px', 9)}</div>`).join('')}</div></div>
            <div class="filters">${[64, 104, 96, 72].map((w) => sk(`${w}px`, 26, 999)).join('')}</div>
            <div class="cols"><div class="w-tbl">${[0, 1, 2, 3, 4, 5].map((i) => `<div class="sk-row">${sk('66px', 14, 3)}${sk(`${[150, 120, 170, 100, 140, 110][i]}px`, 12)}<span style="flex:1"></span>${sk('64px', 20, 999)}${sk('70px', 10)}</div>`).join('')}</div>
              <div class="issues">${sk('140px', 10)}${[0, 1, 2].map(() => sk('100%', 64, 10)).join('')}</div></div></div>`
        : `<div class="w-canvas sk-canvas" aria-busy="true"><div class="loading-pill" style="position:static;transform:none"><span class="spinner"></span>Reading the Figma file…</div></div>`;
      return;
    }
    stopWaiting();
    const box = (sticker, title, body, extra, actions, foot = '') => `<div class="w-empty dm-empty w-fade-in">${ui.emptyIcon('inbox', '', sticker)}<h2>${title}</h2><p>${body}</p>${extra}<div class="actions">${actions}</div>${foot}</div>`;
    const retry = '<button class="btn btn-secondary" data-act="retry">Try again</button>';
    if (kind === 'unplugged') {
      v.innerHTML = box('phone', 'Figma isn’t connected to wridge', 'The design map reads the open Figma file through the wridge plugin, and the plugin isn’t talking to this server right now.',
        `<ol class="steps">
          <li><span class="n">1</span>Open your design file in the Figma desktop app.</li>
          <li><span class="n">2</span><span>Run <kbd>Plugins → Development → wridge</kbd>.</span></li>
          <li><span class="n">3</span>Keep the plugin open — it connects on localhost:3155.</li></ol>`,
        `<button class="btn btn-primary" data-act="connect">How to connect</button>${retry}`, '<p class="hint-line"><span class="spinner"></span>Waiting for the plugin — this page opens by itself</p>');
      waitForPlugin();
    } else if (kind === 'offline') {
      v.innerHTML = box('sleeping', 'Can’t reach the wridge server', 'The server that reads Figma isn’t answering. Start it from Overview, then try again.', '',
        `<button class="btn btn-primary" data-act="overview">Go to Overview</button>${retry}`);
    } else if (kind === 'error') {
      v.innerHTML = box('dizzy', 'Couldn’t read the design map', 'Figma answered, but reading the file failed. Try again — if it keeps happening, the message below helps.',
        `<div class="codebox">${esc(detail)}</div>`, retry.replace('btn-secondary', 'btn-primary'));
    } else if (kind === 'empty') {
      v.innerHTML = box('thinking', 'Nothing to map yet', 'Put frames on the page — or group them in a section named “Checkout · Prototype · Draft” — then rescan.', '',
        '<button class="btn btn-primary" data-act="retry">Rescan</button>');
    }
  }
  $('state-view').addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'retry') load(true);
    else if (act === 'connect') ui.go('settings');
    else if (act === 'overview') ui.go('overview');
  });

  function setBusy(on) {
    busy = on;
    const b = $('refresh');
    b.classList.toggle('is-loading', on);
    b.querySelector('.spinner')?.remove();
    if (on) b.prepend(Object.assign(document.createElement('span'), { className: 'spinner' }));
    b.querySelector('.lbl').textContent = on ? 'Scanning…' : 'Rescan';
    $('list-view').classList.toggle('busy', on && Boolean(raw));
    const meta = $('strip-meta');
    if (meta && raw) meta.innerHTML = metaText();
    if (on && raw && mode !== 'list' && !stateKind) $('canvas-state').insertAdjacentHTML('beforeend', '<div class="loading-pill" id="rescan-pill"><span class="spinner"></span>Reading the Figma file…</div>');
    if (!on) $('rescan-pill')?.remove();
  }

  let loadSeq = 0;
  async function load(refresh = false) {
    const seq = ++loadSeq;
    stopWaiting();
    if (!raw) showState('loading');
    setBusy(true);
    const q = new URLSearchParams();
    if ($('page').value) q.set('pageId', $('page').value);
    if (refresh) q.set('refresh', '1');
    let res, body, secs;
    try {
      [res, secs] = await Promise.all([
        fetch(`/api/graph?${q}`, { cache: 'no-store' }),
        // Section names ("<Name> · <Kind> · <Status>") and their frames, on the page open in Figma.
        fetch('/api/pdf/sections', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      ]);
      body = await res.json().catch(() => ({}));
    } catch {
      if (seq !== loadSeq) return;
      setBusy(false);
      raw = null;
      return showState('offline');
    }
    if (seq !== loadSeq) return;
    setBusy(false);
    if (!res.ok) {
      raw = null;
      return showState(res.status === 503 ? 'unplugged' : 'error', body.error || `HTTP ${res.status}`);
    }
    if (refresh) clearThumbs();
    raw = body;
    secData = secs;
    readAt = Date.now();
    byId = new Map(raw.nodes.map((n) => [n.id, n]));
    if ($('page').options.length === 1 && raw.pages.length > 1) {
      for (const p of raw.pages) $('page').add(new Option(p.name, p.id));
      $('page-wrap').hidden = false;
    }
    rows = buildRows();
    issues = buildIssues();
    const known = new Set(rows.map((r) => r.key));
    expanded = new Set([...expanded].filter((k) => known.has(k)));
    if (!rows.length && !raw.nodes.length) return showState('empty');
    stateKind = null;
    applyMode();
    gs.rerun(); // keep the search lit on the fresh data
  }

  // ======================= wiring =======================
  $('mode').querySelectorAll('button').forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));
  document.querySelectorAll('.tog[data-type]').forEach((b) => (b.onclick = () => {
    show[b.dataset.type] = !show[b.dataset.type];
    b.setAttribute('aria-pressed', String(show[b.dataset.type]));
    if (!raw || mode === 'list') return;
    if (is3D) graph3d.show(); else mindmap.rebuild();
    gs.rerun(); // component hits come and go with the filter
  }));
  $('expand-all').onclick = () => raw && mindmap.setAll(true);
  $('collapse-all').onclick = () => raw && mindmap.setAll(false);
  $('refresh').onclick = () => load(true);
  $('page').onchange = () => { expanded.clear(); load(); };
  $('zoom-in').onclick = () => (is3D ? graph3d : mindmap).zoomBy(1.2);
  $('zoom-out').onclick = () => (is3D ? graph3d : mindmap).zoomBy(1 / 1.2);
  $('zoom-fit').onclick = () => (is3D ? graph3d : mindmap).fit();
  document.addEventListener('keydown', (e) => {
    const typing = e.target.closest?.('input, textarea, select, [contenteditable]');
    if (e.key === '/' && !typing && mode !== 'list' && raw && !stateKind) { e.preventDefault(); $('search').focus(); return; }
    if (e.key === 'Escape' && document.activeElement !== $('search') && mode !== 'list') select(null);
  });
  window.addEventListener('resize', () => graph3d.resize());
  // The window switches theme live: the 3D scene, its legend and its colours follow.
  new MutationObserver(() => {
    graph3d.syncTheme();
    if (raw && mode !== 'list' && !stateKind) { renderLegend(); graph3d.restyle(); }
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  panelSummary();
  applyMode();
  load();
</script>
</body>
</html>
