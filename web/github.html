<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub · wridge</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="/ui.css">
<style>
  /* Figma "wara-bridge" → section "wridge GitHub · Prototype · Approved"; flow: docs/flows/github.md */
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; background: var(--surface); }
  .gh-top { flex: none; gap: 16px; border-bottom: 0; padding-bottom: 6px; }
  .gh-top .w-titles { margin-right: 6px; }
  .gh-spacer { flex: 1; }
  .gh-top .btn { height: 36px; }
  .btn .w-icon { width: 15px; height: 15px; color: currentColor; }

  /* repo switcher */
  .rs { position: relative; }
  .rs-btn { display: flex; align-items: center; gap: 8px; height: 38px; max-width: 340px; padding: 0 10px 0 8px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--background); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; transition: border-color .15s var(--ease), box-shadow .15s var(--ease); }
  .rs-btn:hover { border-color: var(--border-strong); }
  .rs-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .rs-btn .owner { color: var(--text-muted); white-space: nowrap; }
  .rs-btn b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rs-btn .w-icon { width: 14px; height: 14px; color: var(--text-muted); transition: transform .2s var(--ease); }
  .rs-btn[aria-expanded="true"] .w-icon { transform: rotate(180deg); }
  .av { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border-radius: 6px; background: var(--ink); color: var(--on-ink); font: 600 11px/1 var(--sans); text-transform: uppercase; }
  .av.sm { width: 18px; height: 18px; border-radius: 5px; font-size: 10px; }
  .rs-pop { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; width: 300px; padding: 6px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--background); box-shadow: var(--shadow-md); transform-origin: top left; animation: pop-in .16s var(--ease); }
  @keyframes pop-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
  .rs-pop .w-search { width: 100%; height: 34px; margin-bottom: 6px; }
  .rs-list { max-height: 320px; overflow-y: auto; }
  .rs-group { padding: 8px 8px 4px; }
  .rs-item { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: 0; border-radius: 7px; background: none; color: var(--text); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  .rs-item:hover, .rs-item.active { background: var(--surface-2); }
  .rs-item[aria-selected="true"] { background: var(--surface); }
  .rs-item .owner { color: var(--text-muted); }
  .rs-item .lock { width: 12px; height: 12px; color: var(--text-faint); }
  .rs-item .end { margin-left: auto; }
  .rs-none { padding: 10px 8px; font-size: 12.5px; color: var(--text-muted); }
  .rs-add { width: 100%; display: flex; align-items: center; gap: 8px; margin-top: 4px; padding: 9px 8px; border: 0; border-top: 1px solid var(--border); border-radius: 0 0 7px 7px;
    background: none; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
  .rs-add:hover { background: var(--surface-1); }
  .rs-add small { margin-left: auto; font: 11px var(--mono); color: var(--text-faint); }

  .acct { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px 0 4px; border: 1px solid var(--border); border-radius: 999px; background: var(--background);
    color: var(--text-2); font: 12px var(--mono); cursor: pointer; transition: border-color .15s var(--ease); }
  .acct:hover { border-color: var(--border-strong); }
  .acct .av { width: 22px; height: 22px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); }

  /* tabs */
  .tabs { flex: none; display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--border); }
  .tab { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 10px 10px 12px; border: 0; background: none; color: var(--text-muted); font: 500 13px var(--sans); cursor: pointer; }
  .tab .w-icon { width: 15px; height: 15px; color: currentColor; }
  .tab[aria-selected="true"] { color: var(--text); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink); }
  .tab[aria-disabled="true"] { cursor: default; color: var(--text-faint); }
  .tab .n { padding: 1px 6px; border-radius: 999px; background: var(--surface-2); font: 10.5px var(--mono); color: var(--text-muted); }
  .tab[aria-selected="true"] .n { background: var(--ink); color: var(--on-ink); }
  .tab .soon { font: 9.5px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--text-faint); }

  .content { flex: 1; min-height: 0; overflow-y: auto; }
  .banner { margin: 16px 24px 0; }

  /* sign-in cards */
  .center { min-height: 100%; display: grid; place-items: center; padding: 32px; }
  .gate { width: min(368px, 100%); display: flex; flex-direction: column; gap: 16px; padding: 26px; border: 1px solid var(--border); border-radius: 14px; background: var(--background); }
  .gate h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
  .gate p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--text-2); }
  .gate .small { font-size: 11.5px; color: var(--text-muted); }
  .gate .w-tile { width: 38px; height: 38px; }
  .perm { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); }
  .perm div { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--text-2); }
  .perm .w-icon { width: 14px; height: 14px; }
  .perm small { font-size: 11.5px; color: var(--text-muted); }
  .code { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); }
  .code b { font: 600 26px/1 var(--mono); letter-spacing: .14em; }
  .howto { display: flex; flex-direction: column; gap: 9px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .howto li { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-2); counter-increment: s; }
  .howto li::before { content: counter(s); width: 18px; height: 18px; flex: none; display: grid; place-items: center; border-radius: 5px; background: var(--surface-2); font: 10.5px var(--mono); color: var(--text-muted); }
  .wait { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; }
  .wait .spinner { width: 14px; height: 14px; border-width: 2px; }
  .wait small { margin-left: auto; font: 11px var(--mono); color: var(--text-muted); font-weight: 400; }
  .gate-actions { display: flex; align-items: center; gap: 8px; }

  /* actions list */
  .runs-wrap { display: flex; gap: 18px; padding: 18px 24px 32px; }
  .wf { width: 150px; flex: none; display: flex; flex-direction: column; gap: 2px; }
  .wf .w-label { padding: 6px 8px 8px; }
  .wf .w-row { justify-content: space-between; }
  .wf .w-row span:last-child { font: 11px var(--mono); color: var(--text-faint); }
  .runs { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .filters { display: flex; align-items: center; gap: 6px; }
  .fpill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--background);
    color: var(--text-2); font: 500 12.5px var(--sans); cursor: pointer; transition: background .15s var(--ease), color .15s var(--ease); }
  .fpill small { font: 10.5px var(--mono); color: var(--text-faint); }
  .fpill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .fpill[aria-pressed="true"] small { color: color-mix(in srgb, var(--on-ink) 65%, transparent); }
  .branch { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--background); }
  .branch .w-icon { width: 13px; height: 13px; color: var(--text-muted); }
  .branch select { border: 0; outline: 0; background: transparent; color: var(--text-2); font: 11.5px var(--mono); cursor: pointer; }
  .list { border: 1px solid var(--border); border-radius: 10px; background: var(--background); overflow: hidden; }
  .run { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--surface-2); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
    transition: background .12s var(--ease); animation: w-in .24s var(--ease) both; }
  .run:last-child { border-bottom: 0; }
  .list.calm .run { animation: none; }
  .run:hover { background: var(--surface-1); }
  .run:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
  .run .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .run .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run .m { font: 11px var(--mono); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run .when { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font: 11.5px var(--mono); color: var(--text-2); }
  .run .when small { font-size: 11px; color: var(--text-faint); }

  /* status marks */
  .st { width: 16px; height: 16px; flex: none; display: grid; place-items: center; border-radius: 50%; }
  .st svg { width: 10px; height: 10px; }
  .st.k-ok { background: var(--success); color: #fff; }
  .st.k-bad { background: var(--danger); color: #fff; }
  .st.k-off { background: var(--text-faint); color: #fff; }
  .st.k-run { border: 2px solid var(--warning); background: none; }
  .st.k-run::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warning); animation: pulse 1.2s ease-in-out infinite; }
  .st.k-queued { border: 1.5px dashed var(--text-faint); }
  .st.k-skip { border: 1.5px solid var(--text-faint); color: var(--text-faint); }
  .st.k-skip svg { width: 8px; }

  /* run detail */
  .detail { display: flex; flex-direction: column; gap: 16px; padding: 18px 24px 28px; }
  .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; border: 0; background: none; color: var(--text-muted); font: 13px var(--sans); cursor: pointer; }
  .back:hover { color: var(--text); }
  .back .w-icon { width: 14px; height: 14px; color: currentColor; transition: transform .15s var(--ease); }
  .back:hover .w-icon { transform: translateX(-2px); }
  .d-head { display: flex; align-items: center; gap: 10px; }
  .d-head h2 { flex: 1; min-width: 0; margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .d-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: -6px; font: 11.5px var(--mono); color: var(--text-muted); }
  .panel { border: 1px solid var(--border); border-radius: 10px; background: var(--background); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 0; }
  .panel-head small { font: 11px var(--mono); color: var(--text-faint); }
  .jobs { display: flex; align-items: center; gap: 0; padding: 12px 14px 14px; overflow-x: auto; }
  .job { flex: 1 0 150px; max-width: 210px; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--background);
    color: var(--text); font: 500 12.5px var(--mono); cursor: pointer; transition: border-color .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease); }
  .job:hover { border-color: var(--border-strong); }
  .job .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .job small { flex: none; font: 10.5px var(--mono); color: var(--text-faint); }
  .job[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .job.k-bad[aria-pressed="true"] { background: var(--danger-soft); }
  .job.k-run[aria-pressed="true"] { background: var(--warning-soft); }
  .wire { flex: 0 0 22px; height: 1px; background: var(--border-strong); position: relative; }
  .wire::before, .wire::after { content: ""; position: absolute; top: -2px; width: 5px; height: 5px; border-radius: 50%; background: var(--border-strong); }
  .wire::before { left: -2px; } .wire::after { right: -2px; }
  .steps { border-top: 0; }
  .step { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--surface-2); font-size: 13px; }
  .step .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step small { font: 11px var(--mono); color: var(--text-2); }
  .step.k-bad { background: var(--danger-soft); font-weight: 500; }
  .step.k-run { background: var(--warning-soft); font-weight: 500; }
  .step.k-skip .nm { color: var(--text-faint); }
  .log { position: relative; margin: 0; padding: 14px 16px; border-radius: 10px; background: #1A1917; color: #D9D5CC; font: 11.5px/1.75 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow-y: auto; }
  .log .e { color: #F2867B; }
  .log .g { color: #fff; }
  .log .dim { color: #8E897F; }
  .foot { font: 11px var(--mono); color: var(--text-faint); }

  .skel-row { height: 56px; border-bottom: 1px solid var(--surface-2); padding: 14px; }
  .skel-row .skel { height: 10px; margin-bottom: 8px; width: 40%; }
  .skel-row .skel + .skel { width: 25%; }
  .empty-pane { padding: 40px 24px; }

  /* phase 2 tabs (Figma "wridge GitHub · Prototype": Overview, Pull requests, Branches, Commits, Issues, Releases) */
  .pane { display: flex; flex-direction: column; gap: 14px; padding: 18px 24px 32px; }
  .bar2 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .bar2 .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .legend { font: 11px var(--mono); color: var(--text-faint); }
  .list > .w-label { margin: 0; padding: 11px 14px 9px; border-bottom: 1px solid var(--surface-2); }
  .list > .w-label a, .list > .w-label button { float: right; border: 0; background: none; padding: 0; font: 500 12px var(--sans); text-transform: none; letter-spacing: 0; color: var(--primary); cursor: pointer; }
  .run .ico { width: 16px; height: 16px; flex: none; color: var(--text-muted); }
  .run .ico svg { width: 16px; height: 16px; }
  .run .side { flex: none; display: flex; align-items: center; gap: 12px; }
  .cmt { display: inline-flex; align-items: center; gap: 4px; min-width: 30px; font: 11.5px var(--mono); color: var(--text-muted); }
  .cmt svg { width: 13px; height: 13px; }
  .diff { min-width: 74px; text-align: right; font: 11.5px var(--mono); }
  .diff .a { color: var(--success-text); } .diff .d { color: var(--danger-text); }
  .sha { display: inline-flex; align-items: center; gap: 4px; }
  .sha code { padding: 2px 7px; border-radius: 6px; background: var(--surface-2); font: 11px var(--mono); color: var(--text-2); }
  .sha button { display: grid; place-items: center; width: 24px; height: 24px; border: 0; border-radius: 6px; background: none; color: var(--text-muted); cursor: pointer; }
  .sha button:hover { background: var(--surface-2); color: var(--text); }
  .sha .w-icon { width: 13px; height: 13px; }
  .ab { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--text-muted); }
  .ab > span { width: 42px; height: 4px; display: flex; }
  .ab .l { justify-content: flex-end; border-right: 1.5px solid var(--text-faint); }
  .ab .l i { background: var(--text-faint); border-radius: 2px 0 0 2px; }
  .ab .r i { background: var(--primary); border-radius: 0 2px 2px 0; }
  .ab small { width: 22px; font-size: 11px; } .ab small:first-child { text-align: right; }
  .prn { font: 500 12px var(--mono); color: var(--primary); border: 0; background: none; padding: 0; cursor: pointer; }
  .lb { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: 999px; font: 11.5px var(--sans); color: var(--text-2); white-space: nowrap; }
  .lb i { width: 7px; height: 7px; border-radius: 50%; }
  .av.round { border-radius: 50%; background: var(--primary-soft); color: var(--primary); }
  .st.k-none { border: 1.5px solid var(--border-strong); }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--background); text-align: left; font: inherit; color: inherit; cursor: pointer; transition: border-color .15s var(--ease); }
  .stat:hover { border-color: var(--border-strong); }
  .stat b { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
  .stat small { font-size: 12px; color: var(--text-muted); }
  .stat small.warn { color: var(--warning-text); }
  .cols { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .cols > div { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .live { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
  .live .top { display: flex; align-items: center; gap: 8px; font: 11.5px var(--mono); color: var(--text-muted); }
  .live .top .k-run-t { color: var(--warning-text); } .live .top small { margin-left: auto; }
  .live h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .live .jobs { padding: 0; overflow: hidden; }
  .live .job { flex: 1 1 0; min-width: 0; max-width: none; padding: 0 8px; }
  .live .wire { flex-basis: 14px; }
  .need { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border: 0; border-top: 1px solid var(--surface-2); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .need:hover { background: var(--surface-1); }
  .need .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .need b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .need small { font: 11px var(--mono); color: var(--text-muted); }
  .need .ico { width: 16px; height: 16px; flex: none; color: var(--text-muted); } .need .ico svg { width: 16px; height: 16px; }
  .relcard { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  .relcard .h { display: flex; align-items: center; gap: 8px; } .relcard .h b { font-size: 15px; font-weight: 600; }
  .relcard small { font: 11px var(--mono); color: var(--text-muted); }
  .pr-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: -6px; font: 11.5px var(--mono); color: var(--text-muted); }
  .pr-meta code { font: 500 12px var(--mono); color: var(--text); }
  .body { padding: 10px 14px 14px; font-size: 13px; line-height: 1.6; color: var(--text-2); white-space: pre-wrap; }
  .row2 { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--surface-2); font-size: 13px; }
  .row2 .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row2 small { font: 11px var(--mono); color: var(--text-2); }
  .row2 .sub { display: block; font: 11px var(--mono); color: var(--text-muted); }
  .row2 .file { font: 12px var(--mono); }
  .foot2 { padding: 9px 14px 11px; border-top: 1px solid var(--surface-2); font: 11px var(--mono); color: var(--text-faint); }
  .rel { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; }
  .rel .h { display: flex; align-items: center; gap: 10px; }
  .rel .h .w-icon { width: 16px; height: 16px; color: var(--text-muted); } .rel .h .w-icon svg { width: 16px; height: 16px; }
  .rel .h b { font-size: 16px; font-weight: 600; }
  .rel .h small { margin-left: auto; font: 11px var(--mono); color: var(--text-faint); }
  .notes { font-size: 13px; line-height: 1.65; color: var(--text-2); }
  .notes p { margin: 0; } .notes ul { margin: 0; padding-left: 18px; }
  .asset { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 7px; background: var(--surface-1); color: var(--text); font: 12px var(--mono); text-align: left; cursor: pointer; }
  .asset:hover { background: var(--surface-2); }
  .asset .w-icon { width: 14px; height: 14px; color: var(--text-muted); }
  .asset small { margin-left: auto; color: var(--text-faint); }
  .sel { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--background); }
  .sel .w-icon { width: 13px; height: 13px; color: var(--text-muted); }
  .sel select { border: 0; outline: 0; background: transparent; color: var(--text-2); font: 11.5px var(--mono); cursor: pointer; max-width: 200px; }
  .more { padding: 4px 2px; font: 11px var(--mono); color: var(--text-faint); }
  @media (max-width: 980px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header class="w-toolbar gh-top">
  <div class="topbar-left">
    <div class="w-titles"><p class="w-label">Project · GitHub</p><h1>GitHub</h1></div>
  </div>
  <div class="rs" id="rs" hidden>
    <button class="rs-btn" id="rs-btn" aria-haspopup="listbox" aria-expanded="false"><span class="av" id="rs-av">·</span><span class="owner" id="rs-owner"></span><b id="rs-name">Pick a repo</b><span id="rs-st"></span><span class="w-icon" data-wicon="chevrondown"></span></button>
  </div>
  <div class="gh-spacer"></div>
  <button class="acct" id="acct" hidden title="Account and notifications (Settings)"><span class="av" id="acct-av">·</span><span id="acct-name"></span></button>
  <button class="btn btn-secondary" id="open-gh" hidden><span class="w-icon" data-wicon="external"></span>Open on GitHub</button>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="GitHub" hidden></nav>
<div class="content" id="content" aria-live="polite"></div>

<script src="/app-icons.js"></script>
<script src="/ui.js"></script>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = ui.esc;
  const ic = (n) => `<span class="w-icon">${ui.icon(n)}</span>`;
  document.querySelectorAll('[data-wicon]').forEach((el) => { el.innerHTML = ui.icon(el.dataset.wicon); });

  // ---------- state ----------
  let st = null;              // GET /api/github/status
  let repos = null;           // [{fullName, owner, name, private, url}]
  let watch = [];
  let repo = '';              // "owner/name"
  let runs = null;            // GET .../runs
  let runsErr = '';
  let detail = null;          // GET .../runs/{id}
  let detailFor = 0;
  let pickedJob = null;       // job id shown below the nodes
  const logs = new Map();     // job id → log tail
  let filter = 'all', wfPick = '', branchPick = '';
  let timer = 0;
  const shownOnce = new Set();   // repos whose run list has slid in already
  const params = () => new URLSearchParams(location.search);
  const runId = () => Number(params().get('run')) || 0;
  // phase 2: which tab, which pull request, and each tab's answers (key → data) so switching back is instant
  const tab = () => params().get('tab') || (runId() ? 'actions' : 'overview');
  const prNo = () => Number(params().get('pr')) || 0;
  let ov = null, ovRun = null;   // overview of the repo; the run it shows big (with its jobs)
  const tabData = {}, tabErr = {};
  const seen = new Set();        // lists that slid in once already
  let prState = 'open', prMine = false, brFilter = 'all', cmBranch = '', isState = 'open', isMine = false, isLabel = '';

  async function api(path, opts = {}) {
    const res = await fetch('/api/github' + path, { cache: 'no-store', ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers ?? {}) } });
    const body = await res.json().catch(() => ({}));
    if (body.status) st = body.status;
    if (!res.ok) throw new Error(body.error ?? `HTTP ${res.status}`);
    return body;
  }
  const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body ?? {}) });
  const open = (url) => url && post('/open', { url }).catch((e) => ui.toast(e.message, { kind: 'error' }));
  function setUrl(next, push) {
    const q = new URLSearchParams();
    if (next.repo) q.set('repo', next.repo);
    if (next.tab && next.tab !== 'overview') q.set('tab', next.tab);
    if (next.run) q.set('run', next.run);
    if (next.pr) q.set('pr', next.pr);
    const url = `${location.pathname}${q.size ? `?${q}` : ''}`;
    if (url !== location.pathname + location.search) history[push ? 'pushState' : 'replaceState'](null, '', url);
  }

  // ---------- time ----------
  const secs = (a, b) => Math.max(0, Math.round(((b ? Date.parse(b) : Date.now()) - Date.parse(a)) / 1000));
  const dur = (s) => (s == null || Number.isNaN(s) ? '' : s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`);
  const ago = (t) => { if (!t) return ''; const m = Math.round((Date.now() - Date.parse(t)) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.floor(m / 60)} h ago` : m < 2880 ? 'yesterday' : `${Math.floor(m / 1440)} days ago`; };

  // ---------- status marks ----------
  const CHECK = '<svg viewBox="0 0 12 12"><path d="m2.5 6.2 2.3 2.3 4.7-4.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CROSS = '<svg viewBox="0 0 12 12"><path d="m3.5 3.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  const SLASH = '<svg viewBox="0 0 12 12"><path d="M3 6h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  function kind(x) {
    if (!x) return 'queued';
    if (x.status !== 'completed') return x.status === 'in_progress' ? 'run' : 'queued';
    return { success: 'ok', failure: 'bad', timed_out: 'bad', startup_failure: 'bad', cancelled: 'off', skipped: 'skip', neutral: 'off', action_required: 'queued' }[x.conclusion] ?? 'off';
  }
  const mark = (x) => { const k = kind(x); return `<span class="st k-${k}" aria-label="${esc(word(x))}">${k === 'ok' ? CHECK : k === 'bad' ? CROSS : k === 'off' ? SLASH : k === 'skip' ? SLASH : ''}</span>`; };
  function word(x) {
    const k = kind(x);
    return { ok: 'Passed', bad: 'Failed', off: x?.conclusion === 'cancelled' ? 'Cancelled' : 'Done', run: 'Running', queued: x?.status === 'waiting' ? 'Waiting' : 'Queued', skip: 'Skipped' }[k];
  }
  const runSecs = (r) => (r.startedAt ? secs(r.startedAt, r.status === 'completed' ? r.updatedAt : null) : null);

  // ---------- top bar ----------
  function paintTop() {
    const ready = st && ['ready', 'offline', 'expired'].includes(st.state);
    $('#acct').hidden = !(st?.login);
    $('#acct-name').textContent = st?.login ? `@${st.login}` : '';
    $('#acct-av').textContent = (st?.login ?? '·').slice(0, 1);
    $('#rs').hidden = !ready;
    const [owner, name] = repo ? repo.split('/') : ['', ''];
    $('#rs-av').textContent = (name || '·').slice(0, 1);
    $('#rs-owner').textContent = owner ? `${owner} /` : '';
    $('#rs-name').textContent = name || (repos && !repos.length ? 'No repos yet' : 'Pick a repo');
    const active = runs?.runs?.find((r) => r.status !== 'completed');
    const last = runs?.runs?.[0];
    $('#rs-st').innerHTML = repo && runs?.runs?.length ? mark(active ?? last) : '';
    $('#open-gh').hidden = !(ready && repo);
    const tabs = $('#tabs');
    tabs.hidden = !(ready && repo);
    if (!tabs.hidden) {
      const nRun = runs?.runs?.filter((r) => r.status !== 'completed').length ?? 0;
      const R = ov?.data?.repository;
      const n = { actions: nRun, pulls: R?.pullRequests?.totalCount, branches: R?.refs?.totalCount, issues: R?.issues?.totalCount };
      const T = [['overview', 'Overview', ic('overview')], ['actions', 'Actions', ic('actions')], ['pulls', 'Pull requests', gi('pr')], ['branches', 'Branches', ic('branch')], ['commits', 'Commits', gi('commit')], ['issues', 'Issues', gi('issue')], ['releases', 'Releases', gi('tag')]];
      tabs.innerHTML = T.map(([k, t, i]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab() === k}">${i}${t}${n[k] ? `<span class="n">${n[k]}</span>` : ''}</button>`).join('');
      tabs.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => goTab(b.dataset.tab)));
    }
  }
  $('#acct').onclick = () => ui.go('settings');
  $('#open-gh').onclick = () => {
    const r = repos?.find((x) => x.fullName === repo);
    const run = detail?.run, base = r?.url ?? `https://github.com/${repo}`;
    const t = tab(), pr = tabData[`pull:${repo}:${prNo()}`]?.data?.repository?.pullRequest;
    open(t === 'actions' ? (runId() && run?.url ? run.url : `${base}/actions`) : t === 'pulls' ? (prNo() && pr?.url ? pr.url : `${base}/pulls`)
      : t === 'branches' ? `${base}/branches` : t === 'commits' ? `${base}/commits/${encodeURIComponent(cmBranch || defBranch())}` : t === 'issues' ? `${base}/issues` : t === 'releases' ? `${base}/releases` : base);
  };

  // ---------- repo switcher ----------
  let pop = null, popActive = 0;
  function closePop() { pop?.remove(); pop = null; $('#rs-btn').setAttribute('aria-expanded', 'false'); }
  function openPop() {
    closePop();
    pop = document.createElement('div');
    pop.className = 'rs-pop';
    pop.innerHTML = `<label class="w-search">${ic('search')}<input type="search" placeholder="Find a repo…" aria-label="Find a repo" autocomplete="off" spellcheck="false"></label><div class="rs-list" role="listbox" aria-label="Repos"></div>
      <button class="rs-add">${ic('plus')}Add repos on GitHub ${ic('external')}<small>${esc(st?.login ? '@' + st.login : '')}</small></button>`;
    $('#rs').append(pop);
    $('#rs-btn').setAttribute('aria-expanded', 'true');
    const input = pop.querySelector('input');
    const draw = () => {
      const q = input.value.trim().toLowerCase();
      const all = (repos ?? []).filter((r) => !q || r.fullName.toLowerCase().includes(q));
      const recent = q ? [] : watch.map((w) => all.find((r) => r.fullName === w)).filter(Boolean);
      const rest = all.filter((r) => !recent.includes(r));
      const order = [...recent, ...rest];
      popActive = Math.min(popActive, Math.max(0, order.length - 1));
      const row = (r) => { const i = order.indexOf(r); return `<button class="rs-item${i === popActive ? ' active' : ''}" role="option" aria-selected="${r.fullName === repo}" data-i="${i}"><span class="av sm">${esc(r.name.slice(0, 1))}</span><span class="owner">${esc(r.owner)} /</span><b>${esc(r.name)}</b>${r.private ? `<span class="w-icon lock">${ui.icon('lock')}</span>` : ''}</button>`; };
      pop.querySelector('.rs-list').innerHTML = !repos ? '<div class="rs-none">Loading…</div>' : !order.length ? `<div class="rs-none">${repos.length ? 'No repo matches' : 'wridge can’t read any repo yet'}</div>`
        : `${recent.length ? `<p class="w-label rs-group">Recent</p>${recent.map(row).join('')}` : ''}${rest.length ? `<p class="w-label rs-group">All · ${rest.length}</p>${rest.map(row).join('')}` : ''}`;
      pop.querySelectorAll('[data-i]').forEach((b) => (b.onclick = () => { closePop(); pickRepo(order[Number(b.dataset.i)].fullName); }));
      pop._order = order;
    };
    input.oninput = () => { popActive = 0; draw(); };
    input.onkeydown = (e) => {
      const order = pop._order ?? [];
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); popActive = (popActive + (e.key === 'ArrowDown' ? 1 : order.length - 1)) % Math.max(1, order.length); draw(); }
      else if (e.key === 'Enter' && order[popActive]) { closePop(); pickRepo(order[popActive].fullName); }
      else if (e.key === 'Escape') { closePop(); $('#rs-btn').focus(); }
    };
    pop.querySelector('.rs-add').onclick = () => { closePop(); open(st?.installUrl); };
    draw();
    input.focus();
    loadRepos().then(() => pop && draw());
  }
  $('#rs-btn').onclick = () => (pop ? closePop() : openPop());
  document.addEventListener('pointerdown', (e) => { if (pop && !e.target.closest('#rs')) closePop(); });
  document.addEventListener('keydown', (e) => { if (e.ctrlKey && e.key.toLowerCase() === 'k' && !$('#rs').hidden) { e.preventDefault(); openPop(); } });

  function pickRepo(r, push = true) {
    if (r === repo && !runId()) return;
    repo = r;
    try { localStorage.setItem('wridge-gh-repo', r); } catch { /* storage blocked */ }
    runs = null; runsErr = ''; detail = null; wfPick = ''; branchPick = ''; filter = 'all'; ov = null; ovRun = null; cmBranch = ''; isLabel = '';
    setUrl({ repo: r, tab: tab() === 'actions' || !prNo() ? tab() : 'pulls' }, push);
    paint();
    refresh();
  }

  // ---------- loading ----------
  async function loadStatus() { try { st = await api('/status'); } catch { st = st ?? { state: 'error' }; } }
  async function loadRepos() {
    try { const r = await api('/repos'); repos = r.repos; watch = r.watch ?? []; } catch (e) { if (!repos) repos = null; throw e; }
  }
  async function loadRuns() {
    if (!repo) return;
    try { runs = await api(`/repo/${repo}/runs`); runsErr = ''; } catch (e) { runsErr = e.message; }
  }
  async function loadDetail(id) {
    try {
      const d = await api(`/repo/${repo}/runs/${id}`);
      if (runId() !== id) return;
      detail = d; detailFor = id;
      const jobs = d.jobs ?? [];
      if (!jobs.some((j) => j.id === pickedJob)) pickedJob = (jobs.find((j) => kind(j) === 'bad') ?? jobs.find((j) => kind(j) === 'run') ?? jobs[0])?.id ?? null;
      const job = jobs.find((j) => j.id === pickedJob);
      if (job && kind(job) === 'bad' && !logs.has(job.id)) {
        logs.set(job.id, null);
        api(`/repo/${repo}/jobs/${job.id}/log`).then((l) => { logs.set(job.id, l); paint(); }).catch(() => logs.set(job.id, { lines: [], available: false }));
      }
    } catch (e) { if (detailFor !== id) detail = { error: e.message }; }
  }

  // ---------- phase 2 loading ----------
  const defBranch = () => ov?.data?.repository?.defaultBranchRef?.name ?? repos?.find((x) => x.fullName === repo)?.defaultBranch ?? 'main';
  async function loadOverview() {
    if (!repo) return;
    try { const o = await api(`/repo/${repo}/overview`); if (o.repo === repo) ov = o; } catch { /* the tabs just show no counts */ }
  }
  // the overview's big run: the one running, else the newest; its jobs come from the run detail
  async function loadOvRun() {
    const r = runs?.runs?.find((x) => x.status !== 'completed') ?? runs?.runs?.[0];
    if (!r) { ovRun = null; return; }
    if (ovRun?.run?.id === r.id && ovRun.run.status === 'completed' && r.status === 'completed') return;
    try { ovRun = await api(`/repo/${repo}/runs/${r.id}`); } catch { ovRun = { run: r, jobs: [] }; }
  }
  function tabKey() {
    const t = tab(), R = `/repo/${repo}`, enc = encodeURIComponent;
    if (t === 'pulls') return prNo() ? [`pull:${repo}:${prNo()}`, `${R}/pulls/${prNo()}`] : [`pulls:${repo}:${prState}`, `${R}/pulls?state=${prState}`];
    if (t === 'branches') return [`br:${repo}`, `${R}/branches?base=${enc(defBranch())}`];
    if (t === 'commits') return [`cm:${repo}:${cmBranch || defBranch()}`, `${R}/commits?branch=${enc(cmBranch || defBranch())}`];
    if (t === 'issues') return [`is:${repo}:${isState}`, `${R}/issues?state=${isState}`];
    if (t === 'releases') return [`rel:${repo}`, `${R}/releases`];
    return null;
  }
  async function loadTab() {
    if (!repo) return;
    if (tab() === 'overview') return loadOvRun();
    const k = tabKey();
    if (!k) return;
    try { tabData[k[0]] = await api(k[1]); delete tabErr[k[0]]; } catch (e) { tabErr[k[0]] = e.message; }
  }
  function goTab(t, extra = {}) {
    setUrl({ repo, tab: t, ...extra }, true);
    paint();
    loadTab().then(paint);
  }

  // one loop: fast while something runs or signs in, slow otherwise; paused while hidden (unless running)
  async function refresh() {
    clearTimeout(timer);
    await loadStatus();
    const s = st?.state;
    if (['ready', 'offline', 'expired'].includes(s)) {
      if (!repos?.length) await loadRepos().catch(() => {}); // none yet: keep looking (the install page may be open)
      if (!repo && repos?.length) {
        let saved = ''; try { saved = localStorage.getItem('wridge-gh-repo') ?? ''; } catch { /* storage blocked */ }
        const want = params().get('repo');
        repo = [want, saved, ...(watch ?? [])].find((r) => r && repos.some((x) => x.fullName === r)) ?? repos[0].fullName;
        setUrl({ repo, run: runId() || undefined }, false);
      }
      if (repo) {
        await loadRuns();
        if (runId()) await loadDetail(runId());
        await Promise.all([loadOverview(), loadTab()]);
      }
    }
    paint();
    const running = runs?.runs?.some((r) => r.status !== 'completed') || (detail?.run && detail.run.status !== 'completed');
    const ms = s === 'signing_in' ? 2000 : ['ready', 'offline', 'expired'].includes(s) && !repos?.length ? 5000 : running ? 5000 : s === 'offline' ? 15000 : 60000;
    // a hidden page (or one WebView2 wrongly calls hidden) still checks, just less often
    timer = setTimeout(refresh, document.hidden && !running ? Math.max(ms, 60000) : ms);
  }
  addEventListener('popstate', () => { const r = params().get('repo'); if (r && r !== repo) { repo = r; runs = null; ov = null; } detail = null; paint(); refresh(); });

  // ---------- views ----------
  function paint() {
    paintTop();
    const c = $('#content');
    const s = st?.state;
    if (!st) { c.innerHTML = '<div class="center"><span class="spinner"></span></div>'; return; }
    if (s === 'signed_out') return (c.innerHTML = gateSignIn());
    if (s === 'signing_in') return (c.innerHTML = gateCode());
    if (s === 'error') return (c.innerHTML = `<div class="center"><div class="w-empty">${ui.emptyIcon('unplug')}<h2>Can’t reach wridge</h2><p>The wridge server didn’t answer. Is it running?</p></div></div>`);
    if (repos && !repos.length) return (c.innerHTML = gatePick());
    const banner = s === 'expired' ? `<div class="banner warn"><span class="w-icon">${ui.icon('lock')}</span><div class="banner-text"><b>Your GitHub sign-in expired</b>What you see is from before. Sign in again to see new runs.</div><button class="banner-action" data-act="signin">Sign in again</button></div>`
      : s === 'offline' ? `<div class="banner warn"><span class="w-icon">${ui.icon('cloudoff')}</span><div class="banner-text"><b>Can’t reach GitHub</b>Showing what wridge saw last — trying again by itself.</div></div>` : '';
    // keep the log where the reader left it (a repaint every few seconds must not jump); a new log opens at its first error
    const prevLog = $('#log'), prev = prevLog ? { job: Number(prevLog.dataset.job), top: prevLog.scrollTop } : null;
    const t = tab();
    c.innerHTML = banner + (t === 'actions' ? (runId() ? viewDetail() : viewRuns()) : t === 'pulls' ? (prNo() ? viewPull() : viewPulls()) : t === 'branches' ? viewBranches()
      : t === 'commits' ? viewCommits() : t === 'issues' ? viewIssues() : t === 'releases' ? viewReleases() : viewOverview());
    wire(c);
    const log = $('#log');
    if (log) {
      if (prev && prev.job === Number(log.dataset.job)) log.scrollTop = prev.top;
      else { const e = log.querySelector('.e'); if (e) log.scrollTop = Math.max(0, e.offsetTop - log.clientHeight / 2); }
    }
    // rows slide in once per repo, not on every refresh
    if (runs && !runId() && t === 'actions') shownOnce.add(repo);
    c.querySelectorAll('[data-seen]').forEach((el) => seen.add(el.dataset.seen));
  }

  function gateSignIn() {
    const fail = st?.signin?.state;
    const msg = fail === 'denied' ? 'Sign-in was cancelled on GitHub.' : fail === 'expired' ? 'The code expired before it was used.' : fail?.startsWith('error') ? `GitHub said: ${fail.slice(7)}` : '';
    setTimeout(() => wire($('#content')));
    return `<div class="center"><div class="gate w-fade-in">
      <span class="w-tile">${ic('github')}</span>
      <h2>Connect GitHub</h2>
      <p>See Actions runs and why they failed — and get a Windows notification when your run fails — next to your design and code.</p>
      ${msg ? `<div class="banner bad" style="margin:0"><div class="banner-text">${esc(msg)}</div></div>` : ''}
      <div class="perm"><p class="w-label">Read-only access</p>
        <div>${ic('lock')}Actions runs, jobs and logs</div><div>${ic('lock')}Pull requests, reviews and issues</div>
        <div>${ic('lock')}Branches, commits and code</div><div>${ic('lock')}Releases and their files</div>
        <small>wridge can’t push, merge, comment or re-run anything.</small></div>
      <button class="btn btn-primary btn-block" data-act="signin">${msg ? 'Try again' : 'Sign in with GitHub'}</button>
      <p class="small">You sign in on github.com with your own account. The key stays in Windows Credential Manager on this PC — not in wridge’s files.</p>
    </div></div>`;
  }

  let copied = '';
  function gateCode() {
    const si = st.signin;
    const left = si.expiresIn ?? 0;
    setTimeout(() => wire($('#content')));
    return `<div class="center"><div class="gate">
      <p class="w-label">Sign in · step 1 of 2</p>
      <h2>Enter this code on GitHub</h2>
      <div class="code"><b>${esc(si.userCode)}</b><button class="w-pill ${copied === si.userCode ? 'ok dot' : 'raised'}" data-act="copy">${copied === si.userCode ? 'Copied' : 'Copy'}</button></div>
      <ol class="howto"><li>We opened ${esc(si.verificationUri.replace(/^https?:\/\//, ''))} in your browser</li><li>Paste the code and sign in with your account</li><li>Choose Authorize — wridge asks to read only</li></ol>
      <div class="wait"><span class="spinner"></span>Waiting for you to approve…<small>expires in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</small></div>
      <div class="gate-actions"><button class="btn btn-secondary" data-act="reopen">${ic('external')}Open the page again</button><button class="btn btn-ghost" data-act="cancel">Cancel</button></div>
    </div></div>`;
  }

  function gatePick() {
    setTimeout(() => wire($('#content')));
    return `<div class="center"><div class="gate w-fade-in">
      <p class="w-label">Sign in · step 2 of 2</p>
      <span class="w-pill ok dot sans" style="align-self:flex-start">Signed in as @${esc(st.login ?? '')}</span>
      <h2>Pick the repos wridge may read</h2>
      <p>GitHub lets you choose: all your repos, or only some. Repos of an organization need its owner’s OK. You can change this any time.</p>
      <button class="btn btn-primary btn-block" data-act="install">Choose repos on GitHub ↗</button>
      <div class="wait" style="font-weight:400;color:var(--text-muted)"><span class="spinner"></span>Watching for changes — this page moves on by itself.</div>
    </div></div>`;
  }

  function viewRuns() {
    if (!runs && !runsErr) return `<div class="runs-wrap"><div class="runs"><div class="list">${'<div class="skel-row"><div class="skel"></div><div class="skel"></div></div>'.repeat(5)}</div></div></div>`;
    if (!runs) return `<div class="empty-pane w-empty">${ui.emptyIcon('alert')}<h2>Couldn’t load the runs</h2><p>${esc(runsErr)}</p><button class="btn btn-secondary" data-act="retry">Try again</button></div>`;
    const all = runs.runs;
    if (!all.length) return `<div class="empty-pane w-empty">${ui.emptyIcon('inbox')}<h2>No workflow runs yet</h2><p>This repo has no GitHub Actions runs. Add a workflow in <code>.github/workflows/</code> and push — runs show up here by themselves.</p></div>`;
    const wfs = [...new Set(all.map((r) => r.workflow))];
    const branches = [...new Set(all.map((r) => r.branch).filter(Boolean))];
    const inWf = all.filter((r) => (!wfPick || r.workflow === wfPick) && (!branchPick || r.branch === branchPick));
    const nRun = inWf.filter((r) => kind(r) === 'run' || kind(r) === 'queued').length, nBad = inWf.filter((r) => kind(r) === 'bad').length;
    const shown = inWf.filter((r) => filter === 'all' || (filter === 'running' ? ['run', 'queued'].includes(kind(r)) : kind(r) === 'bad'));
    return `<div class="runs-wrap">
      <aside class="wf"><p class="w-label">Workflows · ${wfs.length}</p>
        <button class="w-row${!wfPick ? ' on' : ''}" data-wf=""><span>All workflows</span><span>${all.length}</span></button>
        ${wfs.map((w) => `<button class="w-row${wfPick === w ? ' on' : ''}" data-wf="${esc(w)}"><span>${esc(w)}</span><span>${all.filter((r) => r.workflow === w).length}</span></button>`).join('')}
      </aside>
      <div class="runs">
        <div class="filters">
          <button class="fpill" data-f="all" aria-pressed="${filter === 'all'}">All <small>${inWf.length}</small></button>
          <button class="fpill" data-f="running" aria-pressed="${filter === 'running'}">Running <small>${nRun}</small></button>
          <button class="fpill" data-f="failed" aria-pressed="${filter === 'failed'}">Failed <small>${nBad}</small></button>
          <label class="branch">${ic('branch')}<select id="branch" aria-label="Branch"><option value="">all branches</option>${branches.map((b) => `<option${b === branchPick ? ' selected' : ''}>${esc(b)}</option>`).join('')}</select></label>
        </div>
        <div class="list${shownOnce.has(repo) ? ' calm' : ''}">${shown.length ? shown.map((r, i) => `<button class="run" data-run="${r.id}" style="animation-delay:${Math.min(i, 8) * 18}ms">${mark(r)}
          <span class="txt"><span class="t">${esc(r.title || r.workflow)}</span><span class="m">${esc(r.workflow)} #${r.number} · ${esc(r.branch ?? '')} · ${esc(r.sha ?? '')} · @${esc(r.actor ?? '')}</span></span>
          <span class="when">${esc(dur(runSecs(r)))}<small>${kind(r) === 'run' ? 'running' : kind(r) === 'queued' ? word(r).toLowerCase() : esc(ago(r.updatedAt))}</small></span></button>`).join('')
          : `<div class="rs-none" style="padding:18px 14px">Nothing ${filter === 'running' ? 'running' : 'failed'} here.</div>`}</div>
      </div></div>`;
  }

  function viewDetail() {
    const back = `<button class="back" data-act="back">${ic('arrowleft')}Runs</button>`;
    if (!detail || detailFor !== runId()) return `<div class="detail">${back}${detail?.error ? `<div class="banner bad" style="margin:0"><div class="banner-text">${esc(detail.error)}</div></div>` : '<div class="panel" style="height:220px"><div class="skel-row"><div class="skel"></div><div class="skel"></div></div></div>'}</div>`;
    const r = detail.run, jobs = detail.jobs ?? [];
    const k = kind(r);
    const job = jobs.find((j) => j.id === pickedJob);
    const jobSecs = (j) => (j.startedAt ? secs(j.startedAt, j.completedAt) : null);
    const log = job ? logs.get(job.id) : null;
    const pill = `<span class="w-pill dot sans ${k === 'ok' ? 'ok' : k === 'bad' ? 'bad' : k === 'run' ? 'warn' : ''}">${word(r)}${runSecs(r) != null ? ` · ${dur(runSecs(r))}` : ''}</span>`;
    const waits = (j, i) => (kind(j) === 'queued' && i > 0 ? `needs ${jobs[i - 1].name}` : kind(j) === 'skip' ? 'skipped' : dur(jobSecs(j)));
    let logHtml = '';
    if (job && kind(job) === 'bad') {
      if (log === undefined || log === null) logHtml = '<pre class="log"><span class="dim">Loading the log…</span></pre>';
      else if (!log.available || !log.lines.length) logHtml = `<pre class="log"><span class="dim">GitHub has no log for this job (logs are kept for 90 days).</span></pre>`;
      else logHtml = `<pre class="log" id="log" data-job="${job.id}">${log.lines.map((l) => `<span class="${l.error ? 'e' : l.group ? 'g' : ''}">${esc(l.group ? '▸ ' + l.text.replace('##[group]', '') : l.text.replace('##[endgroup]', ''))}</span>`).join('\n')}</pre>`;
    } else if (job && kind(job) === 'run') {
      logHtml = `<pre class="log"><span class="dim">GitHub shares a job’s log when the job ends — the step list above updates every 5 s.</span></pre>`;
    }
    return `<div class="detail">${back}
      <div class="d-head"><h2>${esc(r.title || r.workflow)}</h2>
        ${k === 'bad' && log?.lines?.length ? `<button class="btn btn-secondary" data-act="copylog">${ic('copy')}Copy error</button>` : ''}
        <button class="btn btn-secondary" data-act="openrun">${ic('external')}Open run on GitHub</button></div>
      <div class="d-meta">${pill}<span>${esc(r.workflow)} #${r.number} · ${esc(r.branch ?? '')} · ${esc(r.sha ?? '')} · @${esc(r.actor ?? '')} · ${esc(r.event ?? '')}</span></div>
      <div class="panel"><div class="panel-head"><p class="w-label">Jobs · ${jobs.length}</p><small>pick a job to see its steps</small></div>
        <div class="jobs">${jobs.map((j, i) => `${i ? '<span class="wire" aria-hidden="true"></span>' : ''}<button class="job k-${kind(j)}" data-job="${j.id}" aria-pressed="${j.id === pickedJob}">${mark(j)}<span class="nm">${esc(j.name)}</span><small>${esc(waits(j, i))}</small></button>`).join('') || '<span class="foot">No jobs yet.</span>'}</div></div>
      ${job ? `<div class="panel steps"><div class="panel-head" style="padding-bottom:10px"><p class="w-label">${esc(job.name)}${job.labels?.[0] ? ` · ${esc(job.labels[0])}` : ''}${jobSecs(job) != null ? ` · ${kind(job) === 'run' ? 'started ' + dur(jobSecs(job)) + ' ago' : dur(jobSecs(job))}` : ''}</p></div>
        ${(job.steps ?? []).map((s) => { const sk = kind(s); return `<div class="step k-${sk}">${mark(s)}<span class="nm">${esc(s.name)}</span><small>${sk === 'skip' || sk === 'queued' ? '–' : esc(dur(s.startedAt ? secs(s.startedAt, s.completedAt) : null))}</small></div>`; }).join('')}</div>` : ''}
      ${logHtml}
      <p class="foot">${k === 'run' || k === 'queued' ? 'Live · updates every 5 s' : `Finished ${esc(ago(r.updatedAt))} · log kept by GitHub for 90 days`}</p>
    </div>`;
  }

  // ---------- phase 2 views ----------
  // GitHub's marks, drawn like Figma "wridge GitHub · Components" (16 px, 1.5 stroke)
  const GI = {
    pr: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="4" cy="3.5" r="1.6"/><circle cx="4" cy="12.5" r="1.6"/><circle cx="12" cy="12.5" r="1.6"/><path d="M4 5.1v5.8M12 10.9V7a2.5 2.5 0 0 0-2.5-2.5H7m1.6-1.6L7 4.5l1.6 1.6"/></svg>',
    merge: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="4" cy="3.5" r="1.6"/><circle cx="4" cy="12.5" r="1.6"/><circle cx="12" cy="8" r="1.6"/><path d="M4 5.1v5.8M4 5.1c0 2 2 2.9 4 2.9h2.4"/></svg>',
    commit: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="2.6"/><path d="M1.5 8h3.9M10.6 8h3.9"/></svg>',
    issue: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/></svg>',
    issueDone: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.2"/><path d="m5.4 8.2 1.8 1.8 3.4-3.6"/></svg>',
    tag: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M1.8 2.8v4.4l6.9 6.9 5.4-5.4-6.9-6.9H2.8a1 1 0 0 0-1 1Z"/><circle cx="5" cy="5" r="1" fill="currentColor" stroke="none"/></svg>',
    comment: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>',
    file: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M4 1.8h5l3 3v9.4H4z"/><path d="M9 1.8v3h3"/></svg>',
  };
  const gi = (n) => `<span class="w-icon">${GI[n]}</span>`;
  // a status rollup (SUCCESS · FAILURE · PENDING …) or a check run as one of the run marks
  const rollKind = (s) => ({ SUCCESS: 'ok', FAILURE: 'bad', ERROR: 'bad', PENDING: 'run', EXPECTED: 'queued' })[s] ?? 'none';
  const markR = (s) => { const k = rollKind(s); return `<span class="st k-${k}" aria-label="${k === 'ok' ? 'Checks passed' : k === 'bad' ? 'Checks failed' : k === 'run' ? 'Checks running' : 'No checks'}">${k === 'ok' ? CHECK : k === 'bad' ? CROSS : ''}</span>`; };
  const checkRun = (c) => (c.__typename === 'StatusContext' ? { status: c.state === 'PENDING' ? 'in_progress' : 'completed', conclusion: c.state === 'SUCCESS' ? 'success' : c.state === 'PENDING' ? null : 'failure' } : { status: (c.status ?? '').toLowerCase(), conclusion: c.conclusion?.toLowerCase() ?? null });
  const rollOf = (pr) => pr?.commits?.nodes?.[0]?.commit?.statusCheckRollup?.state ?? null;
  const me = () => st?.login ?? '';
  const who = (u) => u?.login ?? u?.user?.login ?? u?.name ?? 'ghost';
  const avatar = (login, title) => `<span class="av sm round" title="${esc(title ?? '@' + login)}">${esc((login || '·').slice(0, 1))}</span>`;
  const size = (b) => (b >= 1048576 ? `${(b / 1048576).toFixed(1)} MB` : b >= 1024 ? `${Math.round(b / 1024)} KB` : `${b} B`);
  const day = (t) => { const d = new Date(t), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1); return d.toDateString() === now.toDateString() ? 'Today' : d.toDateString() === y.toDateString() ? 'Yesterday' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
  const shortDate = (t) => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const calm = (k) => (seen.has(k) ? ' calm' : '');
  const anim = (i) => `style="animation-delay:${Math.min(i, 8) * 18}ms"`;
  const skeleton = (rows = 5) => `<div class="pane"><div class="list">${'<div class="skel-row"><div class="skel"></div><div class="skel"></div></div>'.repeat(rows)}</div></div>`;
  const failed = (msg) => `<div class="empty-pane w-empty">${ui.emptyIcon('alert')}<h2>Couldn’t load this from GitHub</h2><p>${esc(msg)}</p><button class="btn btn-secondary" data-act="retab">Try again</button></div>`;
  const emptyPane = (icon, title, text, button = '') => `<div class="empty-pane w-empty"><span class="w-tile">${gi(icon)}</span><h2>${esc(title)}</h2><p>${text}</p>${button}</div>`;
  const sha = (oid, short) => `<span class="sha"><code>${esc(short)}</code><button data-copy="${esc(oid)}" title="Copy the full SHA" aria-label="Copy the SHA">${ic('copy')}</button></span>`;
  // release notes / PR text: plain Markdown lines → paragraphs and bullet lists (no HTML from GitHub is trusted)
  function notes(md) {
    const out = []; let list = [];
    const flush = () => { if (list.length) out.push(`<ul>${list.join('')}</ul>`); list = []; };
    for (const raw of String(md ?? '').split(/\r?\n/)) {
      const l = esc(raw.trim()).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>');
      if (!l) { flush(); continue; }
      if (/^[-*] /.test(raw.trim())) list.push(`<li>${l.slice(2)}</li>`); else { flush(); out.push(`<p>${l.replace(/^#+\s*/, '')}</p>`); }
    }
    flush();
    return out.join('');
  }
  const get = () => { const k = tabKey(); return k ? { key: k[0], data: tabData[k[0]], err: tabErr[k[0]] } : {}; };

  function viewOverview() {
    const R = ov?.data?.repository;
    if (!ov) return `<div class="pane"><div class="stats">${'<div class="stat"><div class="skel" style="width:50%"></div><div class="skel" style="width:30%;height:20px"></div></div>'.repeat(4)}</div></div>`;
    const all = runs?.runs ?? [];
    const running = all.filter((r) => ['run', 'queued'].includes(kind(r)));
    const reviewN = ov.data.review?.issueCount ?? 0;
    const active = (R?.refs?.nodes ?? []).filter((b) => b.target?.committedDate && Date.now() - Date.parse(b.target.committedDate) < 7 * 864e5).length;
    const stat = (label, n, note, goto, warn) => `<button class="stat" data-goto="${goto}"><p class="w-label">${label}</p><b>${n ?? '–'}</b><small class="${warn ? 'warn' : ''}">${note}</small></button>`;
    const big = ovRun?.run ? ovRun.run : null, jobs = ovRun?.jobs ?? [];
    const liveCard = big ? `<div class="panel live" data-run="${big.id}"><div class="top">${mark(big)}<span class="${kind(big) === 'run' ? 'k-run-t' : ''}">${esc(big.workflow)} #${big.number} · ${esc(big.branch ?? '')}</span><small>${esc(dur(runSecs(big)))}</small></div>
      <h3>${esc(big.title || big.workflow)}</h3>
      ${jobs.length ? `<div class="jobs">${jobs.map((j, i) => `${i ? '<span class="wire" aria-hidden="true"></span>' : ''}<span class="job k-${kind(j)}">${mark(j)}<span class="nm">${esc(j.name)}</span><small>${esc(kind(j) === 'queued' ? '' : dur(j.startedAt ? secs(j.startedAt, j.completedAt) : null))}</small></span>`).join('')}</div>` : ''}</div>` : '';
    const recent = all.slice(0, 3);
    const mine = all.filter((r) => kind(r) === 'bad' && r.actor === me() && Date.now() - Date.parse(r.updatedAt) < 2 * 864e5).slice(0, 2);
    const needs = [
      ...(ov.data.review?.nodes ?? []).map((p) => `<button class="need" data-pr="${p.number}">${gi('pr')}<span class="txt"><b>Review #${p.number} ${esc(p.title)}</b><small>@${esc(who(p.author))} asked you · ${esc(ago(p.createdAt))}</small></span></button>`),
      ...mine.map((r) => `<button class="need" data-run="${r.id}">${mark(r)}<span class="txt"><b>${esc(r.workflow)} failed</b><small>${esc(r.branch ?? '')} · your run · ${esc(ago(r.updatedAt))}</small></span></button>`),
      ...(ov.data.assigned?.nodes ?? []).slice(0, 3).map((i) => `<button class="need" data-goto="issues">${gi('issue')}<span class="txt"><b>#${i.number} ${esc(i.title)}</b><small>assigned to you · ${esc(ago(i.updatedAt))}</small></span></button>`),
    ];
    const rel = R?.latestRelease;
    return `<div class="pane">
      <div class="stats">
        ${stat('Running now', running.length, running[0] ? `${esc(running[0].workflow)} on ${esc(running[0].branch ?? '')} · ${esc(dur(runSecs(running[0])))}` : 'nothing running', 'actions', running.length)}
        ${stat('Pull requests', R?.pullRequests?.totalCount, reviewN ? `${reviewN} wait${reviewN === 1 ? 's' : ''} for your review` : 'none waits for you', 'pulls', reviewN)}
        ${stat('Branches', R?.refs?.totalCount, `${active} active this week`, 'branches')}
        ${stat('Issues', R?.issues?.totalCount, `${R?.newIssues?.totalCount ?? 0} new this week`, 'issues')}
      </div>
      <div class="cols">
        <div>${liveCard}
          <div class="list${calm('ov-runs:' + repo)}" data-seen="ov-runs:${esc(repo)}"><p class="w-label">Recent runs<button data-goto="actions">See all</button></p>
            ${recent.length ? recent.map((r, i) => `<button class="run" data-run="${r.id}" ${anim(i)}>${mark(r)}<span class="txt"><span class="t">${esc(r.title || r.workflow)}</span><span class="m">${esc(r.workflow)} #${r.number} · ${esc(r.branch ?? '')} · ${esc(r.sha ?? '')} · @${esc(r.actor ?? '')}</span></span><span class="when">${esc(dur(runSecs(r)))}<small>${esc(ago(r.updatedAt))}</small></span></button>`).join('') : '<div class="foot2">No workflow runs in this repo.</div>'}
          </div></div>
        <div>
          <div class="list"><p class="w-label">Needs you · ${needs.length}</p>${needs.join('') || '<div class="foot2">Nothing waits for you here.</div>'}</div>
          ${rel ? `<div class="list"><p class="w-label">Latest release</p><div class="relcard"><div class="h">${gi('tag')}<b>${esc(rel.tagName)}</b><span class="w-pill dot sans ok">Latest</span></div>
            <small>${esc(shortDate(rel.createdAt))} · @${esc(who(rel.author))}${rel.releaseAssets?.nodes?.[0] ? ` · ${esc(rel.releaseAssets.nodes[0].name)} ${esc(size(rel.releaseAssets.nodes[0].size))}` : ''}</small></div></div>` : ''}
        </div>
      </div></div>`;
  }

  // a pull request's state as a pill: draft, merged, closed, or what the review says
  function prPill(p) {
    if (p.state === 'MERGED') return '<span class="w-pill dot sans accent">Merged</span>';
    if (p.state === 'CLOSED') return '<span class="w-pill dot sans">Closed</span>';
    if (p.isDraft) return '<span class="w-pill dot sans">Draft</span>';
    if (p.reviewRequests?.nodes?.some((r) => r.requestedReviewer?.login === me())) return '<span class="w-pill dot sans warn">Review requested</span>';
    if (p.reviewDecision === 'CHANGES_REQUESTED') return '<span class="w-pill dot sans bad">Changes requested</span>';
    if (p.reviewDecision === 'APPROVED') return '<span class="w-pill dot sans ok">Approved</span>';
    return '';
  }
  const prRow = (p, i) => `<button class="run" data-pr="${p.number}" ${anim(i)}><span class="ico">${GI[p.state === 'MERGED' ? 'merge' : 'pr']}</span>
    <span class="txt"><span class="t">${esc(p.title)}</span><span class="m">#${p.number} · ${esc(p.headRefName)} → ${esc(p.baseRefName)} · @${esc(who(p.author))} · ${p.state === 'MERGED' ? `merged ${esc(ago(p.mergedAt))}${p.mergedBy ? ` by @${esc(who(p.mergedBy))}` : ''}` : p.state === 'CLOSED' ? `closed ${esc(ago(p.closedAt))}` : `${p.isDraft ? 'draft · ' : ''}opened ${esc(ago(p.createdAt))}`}</span></span>
    <span class="side">${prPill(p)}${markR(rollOf(p))}<span class="cmt">${GI.comment}${p.comments?.totalCount ?? 0}</span><span class="diff"><span class="a">+${p.additions ?? 0}</span> <span class="d">−${p.deletions ?? 0}</span></span></span></button>`;

  function viewPulls() {
    const { key, data, err } = get();
    if (!data) return err ? failed(err) : skeleton();
    const R = data.data.repository, waiting = (p) => p.reviewRequests?.nodes?.some((r) => r.requestedReviewer?.login === me());
    let list = R.list?.nodes ?? [];
    const nWait = prState === 'open' ? list.filter(waiting).length : 0;
    if (prMine && prState === 'open') list = list.filter(waiting);
    const pill = (k, label, n) => `<button class="fpill" data-prstate="${k}" aria-pressed="${prState === k}">${label} <small>${n ?? 0}</small></button>`;
    const bar = `<div class="bar2">${pill('open', 'Open', R.open?.totalCount)}${pill('merged', 'Merged', R.merged?.totalCount)}${pill('closed', 'Closed', R.closed?.totalCount)}
      ${prState === 'open' ? `<div class="right"><button class="fpill" data-act="prmine" aria-pressed="${prMine}">Waiting for me <small>${nWait}</small></button></div>` : ''}</div>`;
    if (!list.length && !(prState === 'open' && R.recent?.nodes?.length && !prMine)) {
      const t = prState === 'open' ? (prMine ? 'Nothing waits for your review' : 'No open pull requests') : `No ${prState} pull requests`;
      return `<div class="pane">${bar}</div>${emptyPane('pr', t, prState === 'open' && !prMine ? `When someone opens one in ${esc(repo)}, it shows up here with its checks and reviews.` : '', prState === 'open' && R.merged?.totalCount ? `<button class="btn btn-secondary" data-prstate="merged">See merged · ${R.merged.totalCount}</button>` : '')}`;
    }
    const label = prState === 'open' ? 'Open' : prState === 'merged' ? 'Merged' : 'Closed';
    return `<div class="pane">${bar}
      ${list.length ? `<div class="list${calm(key)}" data-seen="${esc(key)}"><p class="w-label">${label} · ${list.length}</p>${list.map(prRow).join('')}</div>` : `<div class="list"><div class="foot2">No open pull requests.</div></div>`}
      ${prState === 'open' && !prMine && R.recent?.nodes?.length ? `<div class="list${calm(key + ':recent')}" data-seen="${esc(key)}:recent"><p class="w-label">Recently merged<button data-prstate="merged">See all ${R.merged?.totalCount ?? ''}</button></p>${R.recent.nodes.slice(0, 3).map(prRow).join('')}</div>` : ''}
    </div>`;
  }

  function viewPull() {
    const back = `<button class="back" data-act="prback">${ic('arrowleft')}Pull requests</button>`;
    const { data, err } = get();
    if (!data) return `<div class="detail">${back}${err ? `<div class="banner bad" style="margin:0"><div class="banner-text">${esc(err)}</div></div>` : '<div class="panel" style="height:220px"><div class="skel-row"><div class="skel"></div><div class="skel"></div></div></div>'}</div>`;
    const p = data.data.repository.pullRequest;
    const state = p.merged ? '<span class="w-pill dot sans accent">Merged</span>' : p.state === 'CLOSED' ? '<span class="w-pill dot sans">Closed</span>' : p.isDraft ? '<span class="w-pill dot sans">Draft</span>' : '<span class="w-pill dot sans ok">Open</span>';
    const conflicts = p.state === 'OPEN' ? (p.mergeable === 'CONFLICTING' ? '<span class="w-pill dot sans bad">Conflicts</span>' : p.mergeable === 'MERGEABLE' ? '<span class="w-pill dot sans ok">No conflicts</span>' : '') : '';
    const checks = p.checks?.nodes?.[0]?.commit?.statusCheckRollup?.contexts?.nodes ?? [];
    const passed = checks.filter((c) => kind(checkRun(c)) === 'ok').length;
    const commits = p.commits?.nodes ?? [];
    const reviewers = [
      ...(p.reviewRequests?.nodes ?? []).map((r) => ({ login: r.requestedReviewer?.login ?? r.requestedReviewer?.name, state: 'REQUESTED' })),
      ...(p.latestReviews?.nodes ?? []).map((r) => ({ login: who(r.author), state: r.state })),
    ].filter((r) => r.login);
    const revPill = (s) => ({ REQUESTED: '<span class="w-pill dot sans warn">Requested</span>', APPROVED: '<span class="w-pill dot sans ok">Approved</span>', CHANGES_REQUESTED: '<span class="w-pill dot sans bad">Changes</span>', COMMENTED: '<span class="w-pill dot sans">Commented</span>' })[s] ?? `<span class="w-pill dot sans">${esc(s.toLowerCase())}</span>`;
    const files = p.files?.nodes ?? [];
    const shown = files.slice(0, 6), rest = files.slice(6);
    const restA = rest.reduce((a, f) => a + f.additions, 0), restD = rest.reduce((a, f) => a + f.deletions, 0);
    const moreFiles = (p.files?.totalCount ?? files.length) - shown.length;
    return `<div class="detail">${back}
      <div class="d-head"><h2>${esc(p.title)} <span style="color:var(--text-faint);font-weight:400">#${p.number}</span></h2><button class="btn btn-secondary" data-act="openpr">${ic('external')}Open PR on GitHub</button></div>
      <div class="pr-meta">${state}<code>${esc(p.headRefName)} → ${esc(p.baseRefName)}</code><span>@${esc(who(p.author))} ${p.merged ? 'merged' : 'wants to merge'} ${p.commits?.totalCount ?? commits.length} commit${(p.commits?.totalCount ?? 0) === 1 ? '' : 's'} · opened ${esc(ago(p.createdAt))}</span>${conflicts}</div>
      <div class="cols">
        <div>
          ${p.bodyText?.trim() ? `<div class="panel"><div class="panel-head"><p class="w-label">Description</p></div><div class="body">${esc(p.bodyText.trim())}</div></div>` : ''}
          <div class="panel"><div class="panel-head" style="padding-bottom:10px"><p class="w-label">Checks · ${checks.length ? `${passed} passed${checks.length - passed ? ` · ${checks.length - passed} not` : ''}` : 'none'}</p></div>
            ${checks.map((c) => { const k = checkRun(c); const nm = c.__typename === 'StatusContext' ? c.context : `${c.checkSuite?.workflowRun?.workflow?.name ? c.checkSuite.workflowRun.workflow.name + ' / ' : ''}${c.name}`; return `<div class="row2 ${kind(k) === 'bad' ? 'k-bad' : ''}">${mark(k)}<span class="nm">${esc(nm)}</span><small>${esc(c.startedAt ? dur(secs(c.startedAt, c.completedAt)) : '')}</small></div>`; }).join('') || '<div class="foot2">This pull request has no checks.</div>'}</div>
          <div class="panel"><div class="panel-head" style="padding-bottom:10px"><p class="w-label">Commits · ${p.commits?.totalCount ?? commits.length}</p><button class="prn" data-act="prcommits">See all</button></div>
            ${commits.slice().reverse().slice(0, 6).map(({ commit: c }) => `<div class="row2">${markR(c.statusCheckRollup?.state)}<span class="nm">${esc(c.messageHeadline)}<span class="sub">@${esc(who(c.author))} · ${esc(ago(c.committedDate))}</span></span>${sha(c.oid, c.abbreviatedOid)}</div>`).join('')}</div>
        </div>
        <div>
          <div class="panel"><div class="panel-head" style="padding-bottom:10px"><p class="w-label">Reviewers</p></div>
            ${reviewers.map((r) => `<div class="row2">${avatar(r.login)}<span class="nm">@${esc(r.login)}${r.login === me() ? ' (you)' : ''}</span>${revPill(r.state)}</div>`).join('') || '<div class="foot2">No reviewers asked yet.</div>'}</div>
          <div class="panel"><div class="panel-head" style="padding-bottom:10px"><p class="w-label">Changes · ${p.changedFiles ?? files.length} files</p></div>
            ${shown.map((f) => `<div class="row2"><span class="nm file">${esc(f.path)}</span><span class="diff"><span class="a">+${f.additions}</span> <span class="d">−${f.deletions}</span></span></div>`).join('')}
            ${moreFiles > 0 ? `<div class="foot2">+ ${moreFiles} more file${moreFiles === 1 ? '' : 's'} · <span style="color:var(--success-text)">+${p.additions}</span> <span style="color:var(--danger-text)">−${p.deletions}</span> in total</div>` : ''}</div>
        </div>
      </div></div>`;
  }

  function viewBranches() {
    const { key, data, err } = get();
    if (!data) return err ? failed(err) : skeleton();
    const R = data.data.repository, def = R.defaultBranchRef?.name ?? data.base;
    const all = (R.refs?.nodes ?? []).filter((b) => b.name !== def);
    const stale = (b) => !b.target?.committedDate || Date.now() - Date.parse(b.target.committedDate) > 30 * 864e5;
    const mine = (b) => who(b.target?.author) === me();
    const pick = all.filter((b) => brFilter === 'all' || (brFilter === 'mine' ? mine(b) : stale(b)));
    const w = (n) => (n ? Math.min(42, 4 + Math.log2(n + 1) * 8) : 0);
    // compare(headRef: default) on a branch: aheadBy = commits the default branch has that this one doesn't
    const ab = (b) => { const behind = b.compare?.aheadBy ?? 0, ahead = b.compare?.behindBy ?? 0; return `<span class="ab" title="${behind} behind ${esc(def)} · ${ahead} ahead"><small>${behind}</small><span class="l"><i style="width:${w(behind)}px"></i></span><span class="r"><i style="width:${w(ahead)}px"></i></span><small>${ahead}</small></span>`; };
    const row = (b, i) => { const pr = b.associatedPullRequests?.nodes?.[0]?.number; return `<div class="run" data-branch="${esc(b.name)}" ${anim(i)} role="button" tabindex="0">${ic('branch')}<span class="txt"><span class="t" style="font-family:var(--mono);font-weight:500">${esc(b.name)}</span><span class="m">${esc(b.target?.messageHeadline ?? '')} · @${esc(who(b.target?.author))} · ${esc(ago(b.target?.committedDate))}</span></span>
      <span class="side">${b.name === def ? '' : ab(b)}${pr ? `<button class="prn" data-pr="${pr}">#${pr}</button>` : ''}${stale(b) && b.name !== def ? '<span class="st k-off" aria-label="Stale">' + SLASH + '</span>' : markR(b.target?.statusCheckRollup?.state)}</span></div>`; };
    const active = pick.filter((b) => !stale(b)), old = pick.filter(stale);
    const pill = (k, label, n) => `<button class="fpill" data-brf="${k}" aria-pressed="${brFilter === k}">${label} <small>${n}</small></button>`;
    const defRef = { name: def, target: R.defaultBranchRef?.target };
    return `<div class="pane"><div class="bar2">${pill('all', 'All', all.length + 1)}${pill('mine', 'Mine', all.filter(mine).length)}${pill('stale', 'Stale', all.filter(stale).length)}<div class="right legend">behind ${esc(def)} | ahead of ${esc(def)}</div></div>
      ${brFilter === 'all' ? `<div class="list${calm(key + ':d')}" data-seen="${esc(key)}:d"><p class="w-label">Default branch</p>${row(defRef, 0)}</div>` : ''}
      ${active.length ? `<div class="list${calm(key + ':a' + brFilter)}" data-seen="${esc(key)}:a${brFilter}"><p class="w-label">Active · ${active.length}</p>${active.map(row).join('')}</div>` : ''}
      ${old.length ? `<div class="list${calm(key + ':s' + brFilter)}" data-seen="${esc(key)}:s${brFilter}"><p class="w-label">Stale · no commits for 30 days · ${old.length}</p>${old.map(row).join('')}</div>` : ''}
      ${!active.length && !old.length && brFilter !== 'all' ? `<div class="list"><div class="foot2">${brFilter === 'mine' ? 'No branches of yours here.' : 'No stale branches.'}</div></div>` : ''}
    </div>`;
  }

  function viewCommits() {
    const { key, data, err } = get();
    const branchSel = (names) => `<label class="sel">${ic('branch')}<select id="cm-branch" aria-label="Branch">${names.map((n) => `<option${n === (cmBranch || defBranch()) ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></label>`;
    if (!data) return err ? failed(err) : skeleton();
    const R = data.data.repository, hist = R.ref?.target?.history;
    const names = (R.refs?.nodes ?? []).map((b) => b.name);
    if (!names.includes(cmBranch || defBranch())) names.unshift(cmBranch || defBranch());
    const list = hist?.nodes ?? [];
    const groups = [];
    for (const c of list) { const d = day(c.committedDate); const g = groups.at(-1); if (g?.day === d) g.items.push(c); else groups.push({ day: d, items: [c] }); }
    return `<div class="pane"><div class="bar2">${branchSel(names)}<div class="right legend">${hist?.totalCount ?? list.length} commits</div></div>
      ${groups.map((g, gi2) => `<div class="list${calm(key + ':' + gi2)}" data-seen="${esc(key)}:${gi2}"><p class="w-label">${esc(g.day)}</p>${g.items.map((c, i) => `<div class="run" data-open="${esc(c.url)}" role="button" tabindex="0" ${anim(i)}>${markR(c.statusCheckRollup?.state)}<span class="txt"><span class="t">${esc(c.messageHeadline)}</span><span class="m">@${esc(who(c.author))} committed ${esc(ago(c.committedDate))}</span></span><span class="side">${sha(c.oid, c.abbreviatedOid)}</span></div>`).join('')}</div>`).join('') || '<div class="list"><div class="foot2">No commits on this branch.</div></div>'}
    </div>`;
  }

  function viewIssues() {
    const { key, data, err } = get();
    if (!data) return err ? failed(err) : skeleton();
    const R = data.data.repository;
    let list = R.list?.nodes ?? [];
    const labels = [...new Set(list.flatMap((i) => i.labels?.nodes?.map((l) => l.name) ?? []))].sort();
    const assignedMe = (i) => i.assignees?.nodes?.some((a) => a.login === me());
    const nMine = list.filter(assignedMe).length;
    if (isMine) list = list.filter(assignedMe);
    if (isLabel) list = list.filter((i) => i.labels?.nodes?.some((l) => l.name === isLabel));
    const pill = (k, label, n) => `<button class="fpill" data-isstate="${k}" aria-pressed="${isState === k}">${label} <small>${n ?? 0}</small></button>`;
    const bar = `<div class="bar2">${pill('open', 'Open', R.open?.totalCount)}${pill('closed', 'Closed', R.closed?.totalCount)}
      <div class="right"><button class="fpill" data-act="ismine" aria-pressed="${isMine}">Assigned to me <small>${nMine}</small></button>
      ${labels.length ? `<label class="sel">${gi('tag')}<select id="is-label" aria-label="Label"><option value="">label</option>${labels.map((l) => `<option${l === isLabel ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>` : ''}</div></div>`;
    if (!(R.list?.nodes ?? []).length) return `<div class="pane">${bar}</div>${emptyPane('issue', isState === 'open' ? 'No open issues' : 'No closed issues', isState === 'open' ? `Issues opened in ${esc(repo)} show up here with their labels and who has them.` : '')}`;
    const row = (i, n) => `<div class="run" data-open="${esc(i.url)}" role="button" tabindex="0" ${anim(n)}><span class="ico">${GI[isState === 'closed' ? 'issueDone' : 'issue']}</span><span class="txt"><span class="t">${esc(i.title)}</span><span class="m">#${i.number} · ${isState === 'closed' ? `closed ${esc(ago(i.closedAt))}` : `opened ${esc(ago(i.createdAt))}`} by @${esc(who(i.author))}</span></span>
      <span class="side">${(i.labels?.nodes ?? []).slice(0, 3).map((l) => `<span class="lb"><i style="background:#${esc(l.color)}"></i>${esc(l.name)}</span>`).join('')}${(i.assignees?.nodes ?? []).slice(0, 1).map((a) => avatar(a.login)).join('') || '<span class="av sm round" style="visibility:hidden"></span>'}<span class="cmt">${GI.comment}${i.comments?.totalCount ?? 0}</span></span></div>`;
    const total = isState === 'open' ? R.open?.totalCount : R.closed?.totalCount;
    return `<div class="pane">${bar}
      ${list.length ? `<div class="list${calm(key + isMine + isLabel)}" data-seen="${esc(key + isMine + isLabel)}">${list.map(row).join('')}</div>` : '<div class="list"><div class="foot2">No issue matches.</div></div>'}
      ${(R.list?.nodes ?? []).length < (total ?? 0) ? `<p class="more">Showing the newest ${R.list.nodes.length} of ${total} · the rest are on GitHub</p>` : ''}
    </div>`;
  }

  function viewReleases() {
    const { key, data, err } = get();
    if (!data) return err ? failed(err) : skeleton(3);
    const list = data.data.repository.releases?.nodes ?? [];
    if (!list.length) return emptyPane('tag', 'No releases yet', `When ${esc(repo)} publishes a release, its notes and files show up here.`);
    return `<div class="pane${calm(key)}" data-seen="${esc(key)}">${list.map((r) => {
      const pill = r.isDraft ? '<span class="w-pill dot sans">Draft</span>' : r.isPrerelease ? '<span class="w-pill dot sans warn">Pre-release</span>' : r.isLatest ? '<span class="w-pill dot sans ok">Latest</span>' : '';
      const files = r.releaseAssets?.nodes ?? [];
      return `<div class="panel rel"><div class="h">${gi('tag')}<b>${esc(r.tagName)}</b>${pill}<small>${esc(shortDate(r.createdAt))} · @${esc(who(r.author))}${r.tagCommit?.abbreviatedOid ? ` · ${esc(r.tagCommit.abbreviatedOid)}` : ''}</small></div>
        ${r.description?.trim() ? `<div class="notes">${notes(r.description)}</div>` : ''}
        <p class="w-label">Files · ${files.length + 1}</p>
        ${files.map((f) => `<button class="asset" data-open="${esc(f.downloadUrl)}">${gi('file')}${esc(f.name)}<small>${esc(size(f.size))} · ${f.downloadCount} download${f.downloadCount === 1 ? '' : 's'}</small></button>`).join('')}
        <button class="asset" data-open="https://github.com/${esc(repo)}/archive/refs/tags/${esc(encodeURIComponent(r.tagName))}.zip">${gi('file')}Source code (zip)</button>
      </div>`; }).join('')}</div>`;
  }

  // ---------- actions ----------
  function wire(c) {
    c.querySelectorAll('[data-act]').forEach((b) => (b.onclick = () => act(b.dataset.act, b)));
    c.querySelectorAll('[data-wf]').forEach((b) => (b.onclick = () => { wfPick = b.dataset.wf; paint(); }));
    c.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { filter = b.dataset.f; paint(); }));
    const br = c.querySelector('#branch'); if (br) br.onchange = () => { branchPick = br.value; paint(); };
    c.querySelectorAll('[data-run]').forEach((b) => (b.onclick = () => { setUrl({ repo, tab: 'actions', run: b.dataset.run }, true); detail = null; pickedJob = null; paint(); loadDetail(runId()).then(paint); }));
    c.querySelectorAll('[data-job]').forEach((b) => (b.onclick = () => { pickedJob = Number(b.dataset.job); loadDetail(runId()).then(paint); paint(); }));
    // phase 2
    c.querySelectorAll('[data-goto]').forEach((b) => (b.onclick = () => goTab(b.dataset.goto)));
    c.querySelectorAll('[data-pr]').forEach((b) => (b.onclick = (e) => { e.stopPropagation(); goTab('pulls', { pr: b.dataset.pr }); }));
    c.querySelectorAll('[data-prstate]').forEach((b) => (b.onclick = () => { prState = b.dataset.prstate; prMine = false; goTab('pulls'); }));
    c.querySelectorAll('[data-brf]').forEach((b) => (b.onclick = () => { brFilter = b.dataset.brf; paint(); }));
    c.querySelectorAll('[data-isstate]').forEach((b) => (b.onclick = () => { isState = b.dataset.isstate; isMine = false; isLabel = ''; goTab('issues'); }));
    c.querySelectorAll('[data-open]').forEach((b) => { const go = () => open(b.dataset.open); b.onclick = go; b.onkeydown = (e) => { if (e.key === 'Enter') go(); }; });
    c.querySelectorAll('[data-branch]').forEach((b) => { const go = () => { cmBranch = b.dataset.branch; goTab('commits'); }; b.onclick = go; b.onkeydown = (e) => { if (e.key === 'Enter') go(); }; });
    c.querySelectorAll('[data-copy]').forEach((b) => (b.onclick = async (e) => { e.stopPropagation(); (await ui.copy(b.dataset.copy)) ? ui.toast('SHA copied') : ui.toast('Couldn’t copy', { kind: 'error' }); }));
    const cb = c.querySelector('#cm-branch'); if (cb) cb.onchange = () => { cmBranch = cb.value; goTab('commits'); };
    const il = c.querySelector('#is-label'); if (il) il.onchange = () => { isLabel = il.value; paint(); };
  }
  async function act(a, el) {
    if (a === 'signin') {
      ui.setLoading?.(el, true);
      try {
        st = await post('/signin');
        const si = st.signin;
        if (await ui.copy(si.userCode)) copied = si.userCode;
        open(si.verificationUri);
      } catch (e) { ui.toast(e.message, { kind: 'error' }); }
      refresh();
    } else if (a === 'copy') {
      if (await ui.copy(st.signin.userCode)) { copied = st.signin.userCode; paint(); } else ui.toast('Couldn’t copy — select the code instead', { kind: 'error' });
    } else if (a === 'reopen') open(st.signin?.verificationUri);
    else if (a === 'cancel') { await post('/signin/cancel').catch(() => {}); refresh(); }
    else if (a === 'install') open(st.installUrl);
    else if (a === 'retry') { runsErr = ''; paint(); refresh(); }
    else if (a === 'back') { setUrl({ repo, tab: 'actions' }, true); detail = null; paint(); refresh(); }
    else if (a === 'retab') { const k = tabKey(); if (k) delete tabErr[k[0]]; paint(); loadTab().then(paint); }
    else if (a === 'prback') goTab('pulls');
    else if (a === 'prmine') { prMine = !prMine; paint(); }
    else if (a === 'ismine') { isMine = !isMine; paint(); }
    else if (a === 'openpr') open(tabData[`pull:${repo}:${prNo()}`]?.data?.repository?.pullRequest?.url);
    else if (a === 'prcommits') { cmBranch = tabData[`pull:${repo}:${prNo()}`]?.data?.repository?.pullRequest?.headRefName ?? ''; goTab('commits'); }
    else if (a === 'openrun') open(detail?.run?.url);
    else if (a === 'copylog') {
      const l = logs.get(pickedJob);
      if (await ui.copy(l.lines.map((x) => x.text).join(String.fromCharCode(10)))) ui.toast('Error copied'); else ui.toast('Couldn’t copy', { kind: 'error' });
    }
  }
  // the code countdown ticks every second without asking the server
  setInterval(() => { if (st?.state === 'signing_in' && st.signin?.expiresIn > 0) { st.signin.expiresIn--; const s = $('.wait small'); if (s) s.textContent = `expires in ${Math.floor(st.signin.expiresIn / 60)}:${String(st.signin.expiresIn % 60).padStart(2, '0')}`; } }, 1000);
  // the window tells us the run to open (tray notification)
  addEventListener('message', (e) => { if (e.source === window.parent && e.data?.type === 'wridge:github-open' && e.data.repo) { repo = e.data.repo; runs = null; setUrl({ repo, tab: 'actions', run: e.data.run }, true); detail = null; paint(); refresh(); } });

  repo = params().get('repo') ?? '';
  paint();
  refresh();
})();
</script>
</body>
</html>
